<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CyberGuard Chronicles</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#080c08;color:#c8f7c5;font-family:'Courier New',monospace;min-height:100vh}
button{font-family:'Courier New',monospace;cursor:pointer}
textarea,input{font-family:'Courier New',monospace}
.hdr{background:#0a120a;border-bottom:1px solid #1a2e1a;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.main{max-width:780px;margin:0 auto;padding:20px 16px}
.card{background:#0c160c;border:1px solid #1a2e1a;border-radius:3px;padding:18px;margin-bottom:12px}
.h2{color:#00ff41;font-size:15px;margin-bottom:12px;letter-spacing:1px}
.dim{color:#3d6b3a;font-size:12px}
.btn-p{background:#00ff41;border:1px solid #00ff41;color:#080c08;padding:8px 22px;font-size:13px;font-weight:bold;border-radius:2px;margin-right:8px;margin-top:10px}
.btn-o{background:transparent;border:1px solid #00ff41;color:#00ff41;padding:7px 18px;font-size:12px;border-radius:2px;margin-right:8px;margin-top:8px}
.btn-g{background:transparent;border:1px solid transparent;color:#3d6b3a;padding:7px 18px;font-size:12px;border-radius:2px;margin-right:8px;margin-top:8px}
.btn-or{background:transparent;border:1px solid #f97316;color:#f97316;padding:7px 18px;font-size:12px;border-radius:2px;margin-right:8px;margin-top:8px}
.btn-sm{background:transparent;border:1px solid #00ff41;color:#00ff41;padding:4px 10px;font-size:11px;border-radius:2px}
.opt{background:#0c160c;border:1px solid #1a2e1a;border-radius:3px;padding:14px 18px;margin-bottom:8px;cursor:pointer;font-size:13px;line-height:1.6;transition:all 0.2s}
.opt.ok{border-color:#00ff41;color:#00ff41;animation:pulse-ok 0.4s ease}
.opt.bad{border-color:#f97316;color:#f97316;animation:pulse-bad 0.4s ease}
.age-card{border:2px solid #1a2e1a;border-radius:6px;padding:24px;cursor:pointer;text-align:center;transition:all 0.2s;margin-bottom:12px}
.age-card:hover{border-color:#00ff41;background:#0c160c;transform:translateY(-2px)}
@keyframes blink{0%,100%{opacity:.8}50%{opacity:0}}
.cur{display:inline-block;animation:blink .8s infinite}
@keyframes pulse-ok{0%{transform:scale(1)}50%{transform:scale(1.02);box-shadow:0 0 12px #00ff4144}100%{transform:scale(1)}}
@keyframes pulse-bad{0%{transform:scale(1)}50%{transform:scale(1.02);box-shadow:0 0 12px #f9731644}100%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{transform:scale(0.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 8px #00ff4133}50%{box-shadow:0 0 24px #00ff4166}}
.fade-in{animation:fadeIn 0.35s ease both}
.pop-in{animation:popIn 0.4s cubic-bezier(.34,1.56,.64,1) both}
.screen-wrap{animation:fadeIn 0.3s ease both}
.result-icon{animation:popIn 0.5s cubic-bezier(.34,1.56,.64,1) both}
.badge-new{animation:popIn 0.6s cubic-bezier(.34,1.56,.64,1) both}
.diagram{animation:fadeIn 0.5s ease both;margin-bottom:12px;width:100%;border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:7px 10px;text-align:left;color:#3d6b3a;font-weight:normal;border-bottom:1px solid #1a2e1a}
td{padding:9px 10px;border-bottom:1px solid #0c140c;cursor:pointer;transition:background 0.15s}
tr.sel td{color:#00ff41;background:#111d11}
.xp-fill{height:100%;border-radius:3px;transition:width 0.8s cubic-bezier(.4,0,.2,1)}
</style>
</head>

// ─── LOCAL STORAGE PROGRESS ───────────────────────────────────────────────────
const SAVE_KEY = 'cyberguard_progress';

const saveProgress = () => {
  try {
    const data = {
      profile:    ST.profile,
      xp:         ST.xp,
      doneChaps:  ST.doneChaps,
      codex:      ST.codex,
      playerName: ST.playerName,
      chapIdx:    ST.chapIdx,
      chalIdx:    ST.chalIdx,
      screen:     ST.screen,
      savedAt:    new Date().toISOString()
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch(e) { console.warn('Save failed:', e); }
};

const loadProgress = () => {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
};

const clearProgress = () => {
  try { localStorage.removeItem(SAVE_KEY); } catch {}
};

// Auto-save when user closes or leaves the tab
window.addEventListener('beforeunload', () => { if(ST.profile) saveProgress(); });

9: `<svg class="diagram" viewBox="0 0 680 190" xmlns="http://www.w3.org/2000/svg"><rect width="680" height="190" fill="#060a06" rx="4"/><rect x="10" y="10" width="660" height="170" fill="#0c160c" rx="3" stroke="#1a2e1a"/><rect x="10" y="10" width="660" height="28" fill="#1a2e1a" rx="3"/><text x="24" y="29" fill="#3d6b3a" font-size="12" font-family="monospace">🔐 CAESAR CIPHER TO MODERN TLS ENCRYPTION</text><text x="24" y="52" fill="#a855f7" font-size="10" font-family="monospace">CAESAR CIPHER (shift 3): A→D  B→E  C→F ... ATTACK → DWWDFN (only 25 possible shifts!)</text><rect x="20" y="60" width="640" height="18" rx="3" fill="#0a0a1a" stroke="#a855f7"/><text x="30" y="73" fill="#c8f7c5" font-size="10" font-family="monospace">PLAIN:   A B C D E F G H I J K  ...  X Y Z</text><rect x="20" y="82" width="640" height="18" rx="3" fill="#0a0a1a" stroke="#a855f7"/><text x="30" y="95" fill="#a855f7" font-size="10" font-family="monospace">CIPHER:  D E F G H I J K L M N  ...  A B C</text><text x="24" y="118" fill="#06b6d4" font-size="10" font-family="monospace">MODERN TLS/HTTPS: Browser uses RSA key exchange then AES-256 encrypts all data</text><rect x="20" y="126" width="640" height="30" rx="3" fill="#0a0a1a" stroke="#06b6d4"/><text x="30" y="142" fill="#06b6d4" font-size="10" font-family="monospace">AES-256: 2^256 possible keys = more atoms than exist in the observable universe</text><text x="30" y="156" fill="#3d6b3a" font-size="10" font-family="monospace">Caesar: 25 possible shifts. A computer cracks it instantly. See the difference?</text></svg>`,

      {id:'a',label:'Password123!',correct:1,explain:'Common dictionary word + predictable pattern = weak'},
      {id:'b',label:'correct-horse-battery-staple-42!',correct:0,explain:'Long passphrase — extremely strong and memorable'},
      {id:'c',label:'MyName1990',correct:1,explain:'Personal info is easily guessable'},
      {id:'d',label:'X#9mK!vQ2@pL',correct:0,explain:'Random characters, no dictionary words = strong'},
      {id:'e',label:'p@ssw0rd',correct:1,explain:'Known substitution pattern — attackers check these first'}
     ],xp:100},
    {type:'mcq',title:'MISSION 5-B: MFA Under Attack',
     question:'An attacker has your password from a data breach. You have SMS MFA enabled. They call your mobile provider and transfer your number to their SIM. What attack is this?',
     options:['Brute force — use a longer password','SIM Swapping — use an authenticator app instead','Phishing — use a different email','Man-in-the-Middle — use HTTPS only'],
     correct:1,explanations:['This is not brute force — password was already stolen.','SIM Swapping transfers your number to attacker SIM bypassing SMS MFA. Use TOTP apps or hardware keys.','Attack targets your phone number not email.','MitM is a network attack — not relevant here.'],xp:100}
   ],
   codex:[{term:'Credential Stuffing',def:'Using leaked username/password pairs to try logging into other services.'},{term:'MFA',def:'Multi-Factor Authentication — requiring a second verification beyond a password.'},{term:'SIM Swapping',def:'Social engineering a mobile carrier to transfer victim phone number to attacker SIM.'},{term:'Passphrase',def:'A long password made of random words. Long passphrases are stronger than short complex ones.'}]},

          pro:'NEXACORP — Employees visiting malicious websites. Three incidents this week.'},
   challenges:[
    {type:'classify',title:'MISSION 6-A: Safe or Dangerous URL?',desc:'Tap a URL then tap the correct bucket.',
     buckets:['✅ SAFE','⚠️ DANGEROUS'],
     items:[
      {id:'a',label:'https://www.mybank.com/login',correct:0,explain:'HTTPS + correct domain + no suspicious subdomains = safe'},
      {id:'b',label:'http://mybank.com/login',correct:1,explain:'HTTP = unencrypted. Never enter credentials on HTTP'},
      {id:'c',label:'https://mybank.com.verify-now.tk/login',correct:1,explain:'Real domain is verify-now.tk — mybank.com is a subdomain trick'},
      {id:'d',label:'https://www.amazon.co.uk/orders',correct:0,explain:'HTTPS + correct Amazon UK domain = legitimate'}
     ],xp:100},
    {type:'mcq',title:'MISSION 6-B: The Padlock Myth',
     question:'Your colleague says if a website has a padlock it is safe to use. What is wrong?',

     correct:1,explanations:['This is a dangerous misconception — phishing sites have padlocks too.','HTTPS means your connection is encrypted. It says nothing about site legitimacy.','Any website can get a free SSL certificate.','No law enforcement verifies websites via padlocks.'],xp:75}

  {id:7,title:'Fake Social Media & Disinformation',icon:'📱',color:'#a855f7',domain:'report',cis:'14',

  {id:8,title:'Web Vulnerabilities',icon:'🕸️',color:'#f97316',domain:'vuln',cis:'16',
   story:{cadet:'CYBER CADET!\n\nSomeone left a hidden trap in the school website. Find it!',
          pro:'NEXACORP — Customer portal tampered with. XSS and SQL injection vectors found.'},
   challenges:[
    {type:'mcq',title:'MISSION 8-A: Spot the XSS',
     question:'A user posted malicious script code in the comments section that redirects visitors to an evil site and steals their session cookies.\n\nWhy is this dangerous if displayed unfiltered?',
     options:['The comment contains an external link','The script runs in every visitor browser stealing session cookies','The word cookie triggers a security alert','HTML tags are not allowed in comments'],
     correct:1,explanations:['External links alone are not the issue.','XSS! The script runs in victims browsers and sends cookies to the attacker enabling account takeover.','Cookie is a technical term not a trigger.','HTML tags are fine if sanitized.'],xp:100},
    {type:'mcq',title:'MISSION 8-B: SQL Injection',
     question:'An attacker enters admin followed by two dashes into the username field.\n\nThe login query checks username AND password.\n\nWhat happens?',

     correct:2,explanations:['Without sanitization DB processes it as SQL code.','Injection can crash databases but not what happens here.','The password check is commented out — attacker logs in as admin with no password!','That is stored XSS not SQL injection.'],xp:100}
   ],
   codex:[{term:'XSS',def:'Cross-Site Scripting — injecting malicious scripts into web pages viewed by other users.'},{term:'SQL Injection',def:'Inserting SQL code into input fields to manipulate or extract database data.'},{term:'Input Sanitization',def:'Cleaning user inputs so they cannot be interpreted as executable code.'},{term:'OWASP Top 10',def:'Standard list of the 10 most critical web application security risks.'}]},

  {id:9,title:'Cryptography & Encryption',icon:'🔐',color:'#a855f7',domain:'report',cis:'6',
   story:{cadet:'CYBER CADET!\n\nDecode the secret message before the bad guys strike!',
          pro:'NEXACORP — Intercepted encrypted transmission from The Phantom Net. Crack it.'},
   challenges:[
    {type:'caesar',title:'MISSION 9-A: Crack the Cipher',encrypted:'DWWDFN WKH VHUYHU DW PLGQLJKW',answer:'ATTACK THE SERVER AT MIDNIGHT',shift:3,xp:125},
    {type:'mcq',title:'MISSION 9-B: Encryption Fundamentals',
     question:'Your HTTPS connection uses both asymmetric AND symmetric encryption. Why use both?',
     options:['Legal requirement for all websites','Asymmetric safely exchanges a key then fast symmetric encryption handles all data','Asymmetric handles text symmetric handles images','One encrypts data the other encrypts the device'],
     correct:1,explanations:['Not a legal mandate.','Asymmetric (RSA) enables safe key exchange. Then fast symmetric (AES) encrypts everything. This is TLS/HTTPS.','Both work on any data type.','Neither encrypts devices.'],xp:75}
   ],
   codex:[{term:'Caesar Cipher',def:'Shifts each letter by a fixed number. One of history\'s earliest encryption methods.'},{term:'Asymmetric Encryption',def:'Public key encrypts, private key decrypts. Used for secure key exchange. Example: RSA.'},{term:'Symmetric Encryption',def:'One key encrypts and decrypts. Fast. Example: AES.'},{term:'TLS/HTTPS',def:'Combines asymmetric key exchange with symmetric data encryption for web security.'}]},

  {id:10,title:'Threat Intelligence & IOCs',icon:'🕵️',color:'#06b6d4',domain:'ops',cis:'17',
   story:{cadet:'CYBER CADET!\n\nDetectives use clues. Cyber detectives use IOCs — digital clues left by hackers!',
          pro:'NEXACORP — New threat actor identified targeting financial sector. Classify IOCs and map to MITRE ATT&CK.'},
   challenges:[
    {type:'mcq',title:'MISSION 10-A: Classify the IOC',
     question:'Your SIEM flagged these artefacts. Which one is a HOST-BASED IOC?',
     options:['203.0.113.99 — suspicious outbound IP','evil-c2.net — command and control domain','svchost.exe with suspicious hash running from Users Temp folder','Spike in DNS queries at 3am'],
     correct:2,explanations:['Suspicious IP is a network-based IOC.','C2 domain is a network-based IOC.','File hash and suspicious process location (Temp folder) are host-based IOCs found on the endpoint.','DNS query patterns are network-based IOCs.'],xp:100},
    {type:'mcq',title:'MISSION 10-B: Threat Intel Types',
     question:'The CEO asks for a briefing on the threat landscape. Which type of threat intel do you provide?',
     options:['Technical (IOCs, file hashes, IPs)','Tactical (TTPs, attack techniques)','Operational (specific upcoming attacks)','Strategic (high-level trends, threat actors, business risk)'],
     correct:3,explanations:['Technical intel is for SOC analysts — too granular for CEO.','Tactical covers techniques — still too technical for executives.','Operational covers specific attack planning — rarely available.','Strategic intel provides high-level trends and business risk — perfect for executives.'],xp:100}
   ],
   codex:[{term:'IOC',def:'Indicator of Compromise — digital evidence of a breach: file hashes, IPs, domains.'},{term:'MITRE ATT&CK',def:'A knowledge base of adversary tactics and techniques based on real-world observations.'},{term:'TTP',def:'Tactics, Techniques and Procedures — how an attacker operates. Harder to change than IOCs.'}]},

  {id:11,title:'SIEM & Security Monitoring',icon:'📊',color:'#06b6d4',domain:'ops',cis:'8,13',
   story:{cadet:'CYBER CADET!\n\nA SIEM watches the whole network. Which alarm is real?',
          pro:'NEXACORP — SIEM generated 847 alerts overnight. Triage and identify the real attack.'},
   challenges:[
    {type:'mcq',title:'MISSION 11-A: True Positive vs False Positive',
     question:'SIEM alerts: Multiple failed login attempts from IP 203.0.113.99 — 847 attempts in 60 seconds against the admin account.\n\nIs this a true or false positive?',
     options:['False positive — automated scanners do this','True positive — this is a brute force attack requiring immediate investigation','False positive — 847 attempts is within normal range','True positive — this is a DDoS attack'],
     correct:1,explanations:['Legitimate scanners do not target admin accounts with hundreds of attempts per minute.','847 login attempts in 60 seconds against admin = clear brute force — true positive.','847 attempts per minute is far outside any normal authentication pattern.','DDoS floods a server with traffic not login attempts.'],xp:100},
    {type:'mcq',title:'MISSION 11-B: Log Correlation',
     question:'Three events in 5 minutes:\n1. Failed VPN login from unknown IP\n2. Successful login after password reset\n3. Large data transfer to external IP\n\nWhat does this suggest?',
     options:['Three unrelated coincidences','User forgot password and downloaded a large file','Account takeover followed by data exfiltration','Routine IT maintenance'],
     correct:2,explanations:['Three security events within 5 minutes is not coincidence.','A legitimate user would not immediately transfer large data externally.','Failed login then forced password reset then immediate data exfiltration = classic account takeover and theft.','IT maintenance would be scheduled and documented.'],xp:100}
   ],
   codex:[{term:'SIEM',def:'Security Information and Event Management — collects and correlates logs to detect threats.'},{term:'True Positive',def:'A real attack correctly identified by a security tool.'},{term:'False Positive',def:'A benign event incorrectly flagged as an attack. Too many cause alert fatigue.'},{term:'Log Correlation',def:'Connecting related events across systems to identify attack patterns.'}]},

  {id:12,title:'Endpoint Security & EDR',icon:'💻',color:'#06b6d4',domain:'ops',cis:'10,18',
   story:{cadet:'CYBER CADET!\n\nSomething is hiding on the school computer. Find it!',
          pro:'NEXACORP — EDR flagged suspicious process behaviour on workstation WS-047.'},
   challenges:[
    {type:'mcq',title:'MISSION 12-A: Suspicious Process',
     question:'EDR shows this process tree:\n\nwinword.exe then cmd.exe then powershell.exe running hidden with encoded command\n\nWhy is this suspicious?',
     options:['Word documents cannot open command prompts','PowerShell is not installed by default','Word spawning cmd which spawns hidden PowerShell is a classic macro malware pattern','BASE64 encoding is illegal'],
     correct:2,explanations:['By default Word should not spawn cmd.exe but it can via malicious macros.','PowerShell is installed by default on Windows.','A document application spawning hidden PowerShell is textbook macro malware. The hidden flag hides the window.','BASE64 is legitimate encoding but commonly used to obfuscate malicious payloads.'],xp:100},
    {type:'mcq',title:'MISSION 12-B: EDR Response',
     question:'EDR confirms malware on an employee laptop working from home. What is the FIRST action?',
     options:['Tell the employee to restart','Remotely isolate the endpoint from the network immediately','Run a full antivirus scan','Wait until they finish work then investigate'],
     correct:1,explanations:['Restarting may clear volatile memory evidence.','Network isolation is immediate priority — stops malware communicating with C2 servers while preserving for forensics.','Running AV on a live infected system may destroy forensic evidence.','Every minute gives attacker more time to exfiltrate data.'],xp:100}
   ],
   codex:[{term:'EDR',def:'Endpoint Detection and Response — monitors endpoints for malicious behaviour.'},{term:'Fileless Malware',def:'Malware that runs entirely in memory without writing files to disk.'},{term:'Process Tree',def:'Parent-child relationship between running processes — anomalies reveal malicious activity.'},{term:'Containment',def:'Isolating a compromised system to prevent malware spread while preserving it for forensics.'}]},

  {id:13,title:'Vulnerability Scanning & Patching',icon:'🔍',color:'#f97316',domain:'vuln',cis:'7',

    {type:'mcq',title:'MISSION 13-B: Scan Types',

  {id:14,title:'Malware Analysis & Response',icon:'🦠',color:'#ef4444',domain:'ir',cis:'10',
   story:{cadet:'CYBER CADET!\n\nA virus is spreading through the school network. Identify it and stop it!',
          pro:'NEXACORP — Malware detected across 12 endpoints. Classify and execute containment.'},
   challenges:[
    {type:'classify',title:'MISSION 14-A: Classify the Malware',desc:'Tap a malware description then tap the correct type.',
     buckets:['🔒 RANSOMWARE','🐴 TROJAN','👁️ SPYWARE','🪱 WORM'],
     items:[
      {id:'a',label:'Encrypts all files, deletes backups,\ndisplays Bitcoin payment demand',correct:0,explain:'File encryption + ransom demand = Ransomware'},
      {id:'b',label:'Disguises itself as a free game\nbut secretly opens a backdoor',correct:1,explain:'Disguised as legitimate software = Trojan Horse'},
      {id:'c',label:'Silently records keystrokes\nand sends passwords to attacker',correct:2,explain:'Silent data collection = Spyware / Keylogger'},
      {id:'d',label:'Self-replicates across the network\nwithout any user interaction',correct:3,explain:'Self-spreading without user action = Worm'}
     ],xp:100},
    {type:'mcq',title:'MISSION 14-B: Incident Response Order',
     question:'Ransomware is actively spreading. Put the steps in the correct order:\n\n1. Eradicate malware\n2. Identify affected systems\n3. Isolate affected systems\n4. Restore from clean backups\n5. Post-incident review',
     options:['1 then 2 then 3 then 4 then 5','2 then 3 then 1 then 4 then 5','3 then 2 then 1 then 4 then 5','2 then 1 then 3 then 4 then 5'],

  {id:15,title:'Digital Forensics & Evidence',icon:'🔬',color:'#ef4444',domain:'ir',cis:'8',
   story:{cadet:'CYBER CADET!\n\nBe a digital detective! Find the clues carefully so evidence stays valid!',
          pro:'NEXACORP — Preserve evidence for potential legal proceedings. Follow proper forensic procedures.'},
   challenges:[
    {type:'classify',title:'MISSION 15-A: Order of Volatility',desc:'Tap each item then tap the correct volatility bucket.',
     buckets:['🔴 MOST VOLATILE','🟠 MODERATE','🟢 LEAST VOLATILE'],
     items:[
      {id:'a',label:'CPU Registers & Cache\nLost in microseconds',correct:0,explain:'CPU registers are lost instantly — collect first'},
      {id:'b',label:'Hard Drive / SSD\nPersists after shutdown',correct:2,explain:'Hard drive data persists — collect last'},
      {id:'c',label:'RAM / Running Processes\nLost on shutdown',correct:0,explain:'RAM is lost on shutdown — collect before hard drive'},
      {id:'d',label:'Network Connections\nChange rapidly but persist briefly',correct:1,explain:'Network state changes fast but outlasts RAM — moderate'}
     ],xp:125},
    {type:'mcq',title:'MISSION 15-B: Chain of Custody',
     question:'Why is chain of custody critical in digital forensics?',
     options:['It speeds up the investigation','It ensures evidence is admissible in court by documenting who handled it, when, and how','It helps the attacker understand what was found','It is only required for physical evidence'],
     correct:1,explanations:['Chain of custody adds process — it does not speed up investigation.','Documents every person who touched evidence preventing claims of tampering and ensuring legal admissibility.','Chain of custody protects integrity — not shared with attackers.','Digital evidence requires chain of custody too.'],xp:75}
   ],

  {id:16,title:'Security Policies & Compliance',icon:'📋',color:'#a855f7',domain:'report',cis:'4,14',
   story:{cadet:'CYBER CADET!\n\nEvery school has rules to keep everyone safe. Let us help write some security ones!',
          pro:'NEXACORP — External auditors found 3 compliance gaps. Identify violations and map to frameworks.'},
   challenges:[
    {type:'mcq',title:'MISSION 16-A: Policy vs Standard vs Procedure',
     question:'All passwords must be a minimum of 12 characters and changed every 90 days.\n\nWhat type of security document is this?',
     options:['Policy — high-level statement of intent','Standard — specific mandatory requirements that support a policy','Procedure — step-by-step instructions for a task','Guideline — recommended but optional practices'],
     correct:1,explanations:['A policy would say passwords must be strong — without specific numbers.','A standard defines specific measurable requirements (12 chars, 90 days) that implement a policy.','A procedure would describe HOW to change a password step by step.','Guidelines are recommendations — this is mandatory.'],xp:100},
    {type:'mcq',title:'MISSION 16-B: Framework Mapping',
     question:'NexaCorp processes credit card payments. Which compliance framework is MANDATORY?',
     options:['ISO 27001','NIST CSF','PCI DSS','CIS Controls'],
     correct:2,explanations:['ISO 27001 is excellent but not legally mandatory for payment processing.','NIST CSF is voluntary — not legally required.','Payment Card Industry Data Security Standard is mandatory for any organisation processing credit card data.','CIS Controls are best practice guidelines — not a legal requirement.'],xp:75}
   ],
   codex:[{term:'GRC',def:'Governance, Risk and Compliance — framework to manage risk and meet regulatory requirements.'},{term:'PCI DSS',def:'Payment Card Industry Data Security Standard — mandatory for organisations handling card data.'},{term:'ISO 27001',def:'International standard for information security management systems.'},{term:'NIST CSF',def:'National Institute of Standards and Technology Cybersecurity Framework — widely adopted globally.'}]},

  {id:17,title:'AI in Security & Cloud Security',icon:'🤖',color:'#06b6d4',domain:'ops',cis:'17,13',
   story:{cadet:'CYBER CADET!\n\nAI robots help security teams catch hackers faster. But AI can make mistakes too!',
          pro:'NEXACORP — Board approved AI-assisted threat detection. Evaluate tools and identify cloud security gaps.'},
   challenges:[
    {type:'mcq',title:'MISSION 17-A: AI in the SOC',
     question:'Your AI SIEM closes 800 of 847 alerts as false positives. Three days later a breach is discovered that the AI dismissed. What is this failure called?',
     options:['True negative — AI correctly dismissed it','False negative — AI missed a real threat','False positive — AI incorrectly flagged it','True positive — AI correctly identified it'],
     correct:1,explanations:['A true negative correctly identifies a benign event — AI missed a real threat here.','False negative — a real threat incorrectly dismissed as safe. Most dangerous AI failure in security operations.','A false positive flags a benign event as threatening — opposite of what happened.','A true positive correctly identifies a real threat.'],xp:100},
    {type:'mcq',title:'MISSION 17-B: Cloud Misconfiguration',
     question:'A developer accidentally set an S3 bucket containing customer data to public read. What is the immediate risk?',
     options:['Data will be automatically encrypted','Anyone on the internet can access and download the customer data','Only AWS employees can access it','Bucket will be automatically locked after 24 hours'],
     correct:1,explanations:['Encryption and access control are separate.','A public S3 bucket means anyone with the URL can access the data. Billions of records have been exposed this way.','AWS does not restrict public buckets to employees.','AWS does not automatically lock misconfigured buckets.'],xp:100}
   ],
   codex:[{term:'False Negative',def:'A real threat missed by a security tool. More dangerous than false positives.'},{term:'Cloud Misconfiguration',def:'Incorrectly configured cloud resources that expose data. Leading cause of cloud breaches.'},{term:'Shared Responsibility Model',def:'Cloud providers secure infrastructure; customers secure data, configs and access controls.'}]},

  {id:18,title:'Cloud Vulnerability Management',icon:'☁️',color:'#f97316',domain:'vuln',cis:'7,12',
   story:{cadet:'CYBER CADET!\n\nCloud storage is like a giant locker in the sky. Someone left theirs open!',
          pro:'NEXACORP — Cloud infrastructure audit flagged multiple vulnerabilities including exposed API keys.'},
   challenges:[
    {type:'mcq',title:'MISSION 18-A: Exposed API Key',
     question:'A developer accidentally committed an AWS API key with admin permissions to a public GitHub repo. What should happen FIRST?',
     options:['Delete the GitHub commit','Rotate (revoke and replace) the API key immediately','Email the developer to be more careful','Run a vulnerability scan'],
     correct:1,explanations:['Deleting the commit does not revoke the key — still in git history and already indexed by scanners.','Revoke the exposed key immediately. Automated scanners harvest exposed keys within minutes of a public commit.','Awareness training is important but not the immediate priority.','Vulnerability scanning will not revoke an active exposed credential.'],xp:125},
    {type:'mcq',title:'MISSION 18-B: Shared Responsibility',
     question:'A company stores sensitive data in cloud. The cloud provider suffers hardware failure causing data loss. Who is responsible?',
     options:['The cloud provider — they own the infrastructure','The company — they should have configured backups','It depends on the SLA','Neither — hardware failures are force majeure'],
     correct:1,explanations:['Provider is responsible for infrastructure availability but customer is responsible for backup configuration.','Under shared responsibility model, data protection including backup configuration is the customer responsibility.','The SLA covers uptime guarantees — data backup responsibility is in the shared responsibility model.','Force majeure does not eliminate customer responsibility for data protection.'],xp:75}
   ],
   codex:[{term:'API Key',def:'A secret token used to authenticate API calls. Exposed keys give attackers full API access.'},{term:'Secret Scanning',def:'Automated tools that scan code repositories for exposed credentials and API keys.'},{term:'Cloud CSPM',def:'Cloud Security Posture Management — tools that continuously audit cloud configurations.'}]},

  {id:19,title:'Zero Trust & Modern Attack Response',icon:'🎯',color:'#ef4444',domain:'ir',cis:'6,4',
   story:{cadet:'CYBER CADET!\n\nEven your best friend needs to show ID before entering the server room. Zero Trust means ALWAYS CHECK!',
          pro:'NEXACORP — Following last quarter lateral movement attack, Zero Trust Architecture approved.'},
   challenges:[
    {type:'mcq',title:'MISSION 19-A: Zero Trust Core Principle',
     question:'An employee authenticated from the office at 9am. At 2pm the same account requests access to sensitive data from a different country. Under Zero Trust, what happens?',
     options:['Access granted — user already authenticated today','Access granted — office authentication valid for 24 hours','Access blocked and step-up authentication required — context changed significantly','Account permanently disabled'],
     correct:2,explanations:['Zero Trust requires continuous verification — past authentication does not grant future access.','Time-limited sessions still require context validation — geographical impossibility is a major risk signal.','Zero Trust evaluates every request independently. Login from a different country within hours triggers step-up auth.','Permanent disabling is too extreme — step-up authentication verifies legitimacy first.'],xp:100},
    {type:'mcq',title:'MISSION 19-B: Lateral Movement',
     question:'An attacker compromised one laptop. Within an hour they accessed finance server, HR database, and email server using the same credentials. What control would have limited this?',

const MAX_XP = GD.reduce((a,c) => a + c.challenges.reduce((b,ch) => b+ch.xp, 0), 0);

const getLvl = xp => {
  if(xp<200)  return [1,'Script Kiddie'];
  if(xp<500)  return [2,'Junior Analyst'];
  if(xp<900)  return [3,'SOC Analyst'];
  if(xp<1400) return [4,'Security Specialist'];
  if(xp<2000) return [5,'Senior Analyst'];
  return [6,'CyberGuard Elite'];
};

const decipher = (txt, n) => txt.split('').map(c => {
  const code = c.charCodeAt(0);
  if(code>=65&&code<=90) return String.fromCharCode(((code-65-n+26)%26)+65);
  return c;
}).join('');

const pc = () => ST.profile && PROFILES[ST.profile] ? PROFILES[ST.profile].color : '#00ff41';

const domainProgress = () => {
  const prog = {};
  Object.keys(DOMAINS).forEach(d => {
    const total = GD.filter(c => c.domain===d).length;
    const done  = GD.filter(c => c.domain===d && ST.doneChaps.includes(c.id)).length;
    prog[d] = {total, done, pct: total ? Math.round(done/total*100) : 0};
  });
  return prog;
};

const cysa = () => {
  const prog = domainProgress();
  return Math.round(Object.keys(DOMAINS).reduce((a,d) => a + prog[d].pct*(DOMAINS[d].weight/100), 0));
};

function render() {
  try {

    document.getElementById('app').innerHTML = `<div style="color:#ef4444;font-family:monospace;padding:40px;text-align:center">

      <button onclick="location.reload()" style="background:#00ff41;border:none;color:#080c08;padding:8px 20px;cursor:pointer;font-family:monospace">↺ RELOAD</button>

}

function buildApp() {
  if(ST.showCertificate)  return hdr() + buildCert();
  if(ST.showLeaderboard)  return hdr() + buildLB();
  if(ST.showFeedback)     return hdr() + buildFB();
  if(ST.showCodex)        return hdr() + buildCodex();
  if(ST.showDomains)      return hdr() + buildDomains();
  if(ST.screen==='age_select') return buildAge();

// ─── TYPEWRITER ───────────────────────────────────────────────────────────────
function startTyper(text) {
  if(ST.typerTimer) clearInterval(ST.typerTimer);
  let idx = 0;
  ST.typerDone = false;
  ST.typerTimer = setInterval(() => {
    const el = document.getElementById('typer-out');
    if(!el) { clearInterval(ST.typerTimer); return; }
    if(idx >= text.length) {
      clearInterval(ST.typerTimer);
      ST.typerDone = true;
      el.innerHTML = text.replace(/\n/g,'<br>');
      const btn = document.getElementById('typer-btn');
      if(btn) btn.style.display = 'block';
      return;
    }
    el.innerHTML = text.slice(0,++idx).replace(/\n/g,'<br>') + '<span class="cur">█</span>';
  }, 20);
}

function bindEvents() {
  if(ST.screen==='story' && !ST.typerDone) {
    const chap = GD[ST.chapIdx];
    const p = ST.profile||'pro';
    const txt = chap.story[p] || chap.story.pro;
    setTimeout(() => startTyper(txt), 300);
  }
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────────
function resetChal() {
  ST.result = null; ST.hint = null;
  ST.foundSpots = new Set(); ST.classifyAnswers = {}; ST.selectedItem = null;
  ST.selLog = null; ST.shift = 0; ST.selOpt = null;
}

function tog(key) {
  const keys = ['showCodex','showFeedback','showDomains','showLeaderboard','showCertificate'];
  keys.forEach(k => ST[k] = k===key ? !ST[k] : false);
  if(key==='showLeaderboard' && ST.showLeaderboard) {
    getLeaderboard().then(lb => { ST.leaderboard = lb; render(); });
  } else { render(); }
}

window.continueProgress = () => {
  const sv = ST.savedProgress;
  ST.profile    = sv.profile;
  ST.xp         = sv.xp;
  ST.doneChaps  = sv.doneChaps;
  ST.codex      = sv.codex||[];
  ST.playerName = sv.playerName;
  ST.chapIdx    = sv.chapIdx||0;
  ST.chalIdx    = sv.chalIdx||0;
  ST.screen     = 'title';
  render();
};

window.startFresh = () => {
  clearProgress();
  ST.savedProgress = null;
  ST.screen = 'age_select';
  render();
};



window.startChap = async i => {
  ST.chapIdx = i; ST.sceneIdx = 0; ST.chalIdx = 0;
  resetChal(); ST.typerDone = false; ST.screen = 'story'; render();
  if(i===0) incCount().then(n => { ST.playerCount = n; });
};

window.advScene = () => { resetChal(); ST.chalIdx = 0; ST.screen = 'challenge'; render(); };
window.addSpot  = id => { ST.foundSpots.add(id); render(); };
window.placeItem = bucketIdx => {
  if(!ST.selectedItem || ST.selectedItem==='null') return;
  ST.classifyAnswers[ST.selectedItem] = bucketIdx;
  ST.selectedItem = null; render();
};

const doSubmit = (ok, expl, earned) => {
  if(ok) ST.xp += earned;
  ST.result = {ok, expl, earned: ok?earned:0};
  ST.screen = 'result';
  saveProgress(); // ← auto-save after every mission
  render();
};

window.submitMCQ = () => {
  const chal = GD[ST.chapIdx].challenges[ST.chalIdx];
  const ok = ST.selOpt===chal.correct;
  doSubmit(ok, (ok?'✅ ':'❌ ') + chal.explanations[ST.selOpt], chal.xp);
};
window.submitEmailSpot = () => doSubmit(true, '✅ Excellent! You identified all phishing indicators like a pro.', GD[ST.chapIdx].challenges[ST.chalIdx].xp);
window.submitSpotFlags = () => doSubmit(true, '✅ Outstanding! You identified all vishing tactics in the call.', GD[ST.chapIdx].challenges[ST.chalIdx].xp);
window.submitCaesar = () => {
  const chal = GD[ST.chapIdx].challenges[ST.chalIdx];
  doSubmit(true, `✅ Shift was ${chal.shift}. "${chal.answer}" — their plan is exposed! Caesar ciphers have only 25 possible shifts — trivially brute-forced.`, chal.xp);
};
window.submitLog = () => {
  const chal = GD[ST.chapIdx].challenges[ST.chalIdx];
  const ok = ST.selLog===chal.suspId;
  doSubmit(ok, ok ? chal.explanation : '❌ Not quite. Focus on external IPs (not 192.168.x.x) accessing internal services.', chal.xp);
};
window.submitClassify = () => {
  const chal = GD[ST.chapIdx].challenges[ST.chalIdx];
  const score = chal.items.filter(item => ST.classifyAnswers[item.id]===item.correct).length;
  const ok = score===chal.items.length;
  if(ok) ST.xp += chal.xp;
  ST.result = {ok, expl: ok ? `✅ Perfect! You correctly classified all ${chal.items.length} items.` : `You got ${score}/${chal.items.length} correct. Review the explanations on each item.`, earned: ok?chal.xp:0};
  ST.screen = 'result'; render();
};

window.nextChal = async () => {
  const chap = GD[ST.chapIdx];
  if(ST.chalIdx < chap.challenges.length-1) {
    ST.chalIdx++; resetChal(); ST.screen = 'challenge'; render();
  } else {
    const newE = chap.codex.filter(e => !ST.codex.find(c => c.term===e.term));
    ST.codex = [...ST.codex, ...newE];
    ST.doneChaps = [...ST.doneChaps, chap.id];
    if(ST.playerName) await saveLeaderboard();
    ST.screen = 'chap_end'; render();
  }
};

window.getHint = async () => {
  const chal = GD[ST.chapIdx].challenges[ST.chalIdx];
  ST.hintLoading = true; render();
  try {
    const res = await fetch('/api/hint', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title:chal.title})});
    const d = await res.json();
    ST.hint = d.hint || 'Think carefully about what looks unusual or out of place.';
  } catch { ST.hint = 'Think carefully about what looks unusual or out of place.'; }
  ST.hintLoading = false; render();
};

window.submitFB = async () => {
  if(!ST.fbRating || !ST.fbText.trim() || ST.fbLoading) return;
  ST.fbLoading = true; render();
  const ok = await saveFeedback(ST.fbRating, ST.fbText.trim(), ST.xp);
  if(ok) { ST.fbSubmitted = true; ST.feedbacks = await getFeedbacks(); }
  ST.fbLoading = false; render();
};

window.saveAgentName = async () => {
  const el = document.getElementById('aname');
  if(!el || !el.value.trim()) return;
  ST.playerName = el.value.trim().replace(/[<>]/g,'').slice(0,20);
  await saveLeaderboard();
  ST.leaderboard = await getLeaderboard();
  render();
};

window.copyShare = () => {
  const lvl = getLvl(ST.xp);
  const r = cysa();
  const text = `🎉 I completed CyberGuard Chronicles — CySA+ CS0-004 aligned cybersecurity training!\n🛡️ Rank: ${lvl[1]} · ${ST.xp} XP · ${earnedBadges().length} badges · ${r}% CySA+ readiness\n🎮 Try it: cyberguard-chronicless.vercel.app`;
  navigator.clipboard.writeText(text).then(() => alert('✅ Copied!')).catch(() => alert('Please copy manually.'));
};

// ─── INIT ─────────────────────────────────────────────────────────────────────
window.selProfile = p => { ST.profile = p; ST.screen = 'title'; saveProgress(); render(); };
window.continueProgress = () => {
  const sv = ST.savedProgress;
  ST.profile    = sv.profile;
  ST.xp         = sv.xp;
  ST.doneChaps  = sv.doneChaps;
  ST.codex      = sv.codex||[];
  ST.playerName = sv.playerName;
  ST.chapIdx    = sv.chapIdx||0;
  ST.chalIdx    = sv.chalIdx||0;
  ST.screen     = 'title';
  render();
};
window.startFresh = () => {
  clearProgress();
  ST.savedProgress = null;
  ST.screen = 'age_select';
  render();
};

const saved = loadProgress();
if(saved && saved.profile && saved.doneChaps && saved.doneChaps.length > 0) {
  ST.savedProgress = saved;
  ST.screen = 'welcome_back';
}
render();
setTimeout(() => {
  getCount().then(c => { ST.playerCount = c; if(ST.screen==='title') render(); }).catch(() => {});
  getFeedbacks().then(f => { ST.feedbacks = f; if(ST.screen==='title') render(); }).catch(() => {});
}, 100);
</script>
</body>
