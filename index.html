async function getCount(){
  try{
    const{data,error}=await sb.from('player_count').select('count').eq('id',1).single();
    if(error)throw error;
    return data?.count??0;
  }catch(err){log.error('getCount failed',err);return 0;}
}
async function incrementCount(){
  try{
    const c=await getCount();
    const{error}=await sb.from('player_count').update({count:c+1}).eq('id',1);
    if(error)throw error;
    return c+1;
  }catch(err){log.error('incrementCount failed',err);return 0;}
}
async function getFeedbacks(){
  try{
    const{data,error}=await sb.from('feedback').select('*').order('created_at',{ascending:false}).limit(50);
    if(error)throw error;
    return data||[];
  }catch(err){log.error('getFeedbacks failed',err);return[];}
}
async function saveFeedback(rating,text,xp){
  try{
    // A03 — sanitise input before sending to DB
    const clean=String(text).slice(0,200).replace(/[<>]/g,'');
    const{error}=await sb.from('feedback').insert({rating:parseInt(rating),text:clean,xp:parseInt(xp)||0});
    if(error)throw error;
    return true;
  }catch(err){log.error('saveFeedback failed',err);return false;}
}

async function saveLeaderboard(){
  try{
    const name=S.playerName||'Anonymous Agent';
    const{error}=await sb.from('leaderboard').upsert({name,xp:S.xp,profile:S.profile,badges:earnedBadges().length,updated_at:new Date().toISOString()},{onConflict:'name'});
    if(error)throw error;
    log.info('Leaderboard saved');
  }catch(err){log.error('saveLeaderboard failed',err);}
}

const MAX_XP = GD.chapters.reduce((a,c)=>a+c.challenges.reduce((b,ch)=>b+ch.xp,0),0);
function getLvl(xp){
  if(xp<200)return[1,'Script Kiddie'];
  if(xp<500)return[2,'Junior Analyst'];
  if(xp<900)return[3,'SOC Analyst'];
  if(xp<1400)return[4,'Security Specialist'];
  if(xp<2000)return[5,'Senior Analyst'];
  return[6,'CyberGuard Elite'];
}
function decipher(txt,n){return txt.split('').map(c=>{const code=c.charCodeAt(0);if(code>=65&&code<=90)return String.fromCharCode(((code-65-n+26)%26)+65);return c;}).join('');}

function domainProgress(){
  const prog={};
  Object.keys(DOMAINS).forEach(d=>{
    const chapInDomain=GD.chapters.filter(c=>c.domain===d);
    const done=chapInDomain.filter(c=>S.doneChaps.includes(c.id));
    prog[d]={total:chapInDomain.length,done:done.length,pct:chapInDomain.length?Math.round((done.length/chapInDomain.length)*100):0};
  });
  return prog;
}
function cysa_readiness(){
  const prog=domainProgress();
  const score=Object.keys(DOMAINS).reduce((a,d)=>{
    return a+(prog[d].pct*(DOMAINS[d].weight/100));
  },0);
  return Math.round(score);
}

function render(){
  try {
    document.getElementById('app').innerHTML=buildApp();
    bindEvents();
  } catch(err) {
    log.error('render failed', err);
    document.getElementById('app').innerHTML='<div style="color:#ef4444;font-family:monospace;padding:40px;text-align:center"><div style="font-size:32px">⚠️</div><div style="margin:16px 0">'+err.message+'</div><button onclick="location.reload()" style="background:#00ff41;border:none;color:#080c08;padding:8px 20px;cursor:pointer">↺ RELOAD</button></div>';
  }
}

function buildApp(){
  if(S.showCertificate)return buildHdr()+buildCertificate();
  if(S.showLeaderboard)return buildHdr()+buildLeaderboard();
  if(S.showFeedback)return buildHdr()+buildFeedback();
  if(S.showCodex)return buildHdr()+buildCodex();
  if(S.showDomains)return buildHdr()+buildDomains();
  if(S.screen==='age_select')return buildAgeSelect();
  if(S.screen==='title')return buildHdr()+buildTitle();
  if(S.screen==='story')return buildHdr()+buildStory();
  if(S.screen==='challenge')return buildHdr()+buildChallenge();
  if(S.screen==='result')return buildHdr()+buildResult();
  if(S.screen==='chap_end')return buildHdr()+buildChapEnd();
  return buildHdr()+'<div class="main"><div class="dim">Loading...</div></div>';
}

function profileColor(){return S.profile?PROFILES[S.profile].color:'#00ff41';}

function buildHdr(){
  const[lvl,lvlTitle]=getLvl(S.xp);
  const pct=Math.min((S.xp/MAX_XP)*100,100);
  const p=S.profile?PROFILES[S.profile]:PROFILES.pro;
  const readiness=cysa_readiness();
  return`<div class="hdr">
    <div class="hdr-title" style="color:${profileColor()}">⚡ CYBERGUARD</div>
    <div class="hdr-right">
      <div class="xp-bar-wrap">
        <div class="xp-label">LVL ${lvl} · ${lvlTitle}</div>
        <div class="xp-row">
          <div class="xp-track"><div class="xp-fill" style="width:${pct}%;background:${profileColor()}"></div></div>
          <span class="xp-num" style="color:${profileColor()}">${S.xp} ${p.xpLabel}</span>
        </div>
      </div>
      <button class="btn-sm" style="border-color:${profileColor()};color:${profileColor()}" onclick="toggleDomains()">🎯 ${readiness}%</button>
      <button class="btn-sm" onclick="toggleLeaderboard()">🏆</button>
      <button class="btn-sm" onclick="toggleFeedback()">💬 ${S.feedbacks.length}</button>
      <button class="btn-sm" onclick="toggleCodex()">📚 ${S.codex.length}</button>
    </div>
  </div>`;
}

// ─── CHALLENGE ────────────────────────────────────────────────────────────────
function buildChallenge(){
  const chap=GD.chapters[S.chapIdx];
  const chal=chap.challenges[S.chalIdx];
  let body='';

  if(chal.type==='mcq'){
    const opts=chal.options.map((opt,i)=>{
      let cls='opt';
      if(S.selOpt===i)cls+=i===chal.correct?' sel-correct':' sel-wrong';
      return`<div class="${cls}" onclick="selectOpt(${i})"><span style="color:${S.selOpt===i?'inherit':'#3d6b3a'}">[${String.fromCharCode(65+i)}]</span> ${opt}</div>`;
    }).join('');
    body=`<div class="h2">${chal.title}</div>
      <div class="card" style="background:#080c08;white-space:pre-wrap;font-size:13px;line-height:1.9">${chal.question}</div>
      ${opts}
      ${S.selOpt!==null?`<button class="btn-primary" onclick="submitMCQ()">SUBMIT ANSWER</button>`:''}`;
  }

  if(chal.type==='email_spot'){
    const found=S.foundSpots;
    const sp=(id,label,extraColor)=>{const active=found.has(id);const color=active?'#00ff41':(extraColor||'#f97316');const border=active?'1px solid #00ff41':'1px dashed #f97316';return`<span style="cursor:pointer;border-bottom:${border};color:${color}" onclick="addSpot('${id}')">${label}</span>`;};
    body=`<div class="h2">${chal.title}</div>
      <div class="dim">${chal.desc}</div>
      <div class="card" style="background:#060a06;margin-top:12px;font-size:13px">
        <div class="dim" style="margin-bottom:10px;line-height:1.8">FROM: ${sp('email','security@nexac0rp.com')}<br>TO: you@nexacorp.com<br>SUBJECT: ${sp('urgency','⚠️ URGENT: Your account suspended in 24 hours!')}</div>
        <div style="border-top:1px solid #1a2e1a;padding-top:12px;line-height:2">
          Dear Valued Employee,<br><br>We detected unusual activity. Your account will be ${sp('urgency','SUSPENDED unless you verify IMMEDIATELY')}.<br><br>
          Click here → ${sp('link','http://nexacorp-security.verify-now.tk/login','#06b6d4')}<br><br>
          ${sp('threat','Failure to act within 24 hours = permanent account termination.')}<br><br>— NexaCorp Security Team
        </div>
      </div>
      <div style="margin-top:10px"><div class="dim">Found: ${found.size} / ${chal.spots.length}</div>
      ${[...found].map(id=>{const s=chal.spots.find(x=>x.id===id);return s?`<div style="color:#00ff41;font-size:12px;margin-top:5px">✓ ${s.label}</div>`:''}).join('')}</div>
      ${found.size===chal.spots.length?`<button class="btn-primary" onclick="submitEmailSpot()">CONFIRM — ALL FOUND ✓</button>`:''}`;
  }

  if(chal.type==='spot_flags'){
    const found=S.foundSpots;
    const sp=(id,label,text)=>{const active=found.has(id);return`<span style="cursor:pointer;background:${active?'#1a3a1a':'transparent'};border-bottom:${active?'1px solid #00ff41':'1px dashed #f97316'};color:${active?'#00ff41':'#f97316'};padding:1px 2px" onclick="addSpot('${id}')">${text}</span>`;};
    body=`<div class="h2">${chal.title}</div>
      <div class="dim">${chal.desc}</div>
      <div class="card" style="background:#060a06;margin-top:12px;font-size:13px;line-height:2.2">
        "Good afternoon, I'm calling from Microsoft Security. ${sp('false_authority','false_authority','[1] We\'ve detected that your computer is sending out viruses')} and ${sp('urgency','urgency','[2] if we don\'t fix it in the next 15 minutes your account will be permanently deleted.')} I\'ll need you to ${sp('remote_access','remote_access','[3] download a remote access tool')} so I can fix it for you, and ${sp('payment','payment','[4] provide your credit card for the $49.99 security fee')}."
      </div>
      <div style="margin-top:10px"><div class="dim">Found: ${found.size} / ${chal.spots.length}</div>
      ${[...found].map(id=>{const s=chal.spots.find(x=>x.id===id);return s?`<div style="color:#00ff41;font-size:12px;margin-top:5px">✓ ${s.label}</div>`:''}).join('')}</div>
      ${found.size===chal.spots.length?`<button class="btn-primary" onclick="submitSpotFlags()">CONFIRM — ALL FOUND ✓</button>`:''}`;
  }

  if(chal.type==='caesar'){
    const decoded=S.shift>0?decipher(chal.encrypted,S.shift):'——————————————————————';
    const correct=decoded===chal.answer;
    body=`<div class="h2">${chal.title}</div>
      <div class="card" style="background:#060a06">
        <div class="dim">ENCRYPTED:</div>
        <div style="color:#f97316;font-size:18px;letter-spacing:4px;margin:10px 0;font-weight:bold">${chal.encrypted}</div>
        <div class="dim">YOUR DECRYPTION (shift = ${S.shift}):</div>
        <div style="color:${correct?'#00ff41':'#c8f7c5'};font-size:18px;letter-spacing:4px;margin:10px 0;min-height:28px">${decoded}</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;margin:14px 0;padding:14px;background:#0c160c;border-radius:3px">
        <span class="dim">SHIFT:</span>
        <input type="range" min="0" max="25" value="${S.shift}" oninput="setShift(this.value)" style="flex:1;accent-color:${profileColor()};cursor:pointer">
        <span style="color:${profileColor()};min-width:24px;font-size:18px;font-weight:bold">${S.shift}</span>
      </div>
      ${correct?`<button class="btn-primary" onclick="submitCaesar()">CONFIRM DECRYPTION ▶</button>`:''}
      ${!correct&&S.shift>0?`<div class="dim" style="margin-top:6px">Keep adjusting... make it readable English.</div>`:''}`;
  }

  if(chal.type==='classify'){
    const placed=S.foundSpots; // reuse foundSpots as {itemId: bucketIndex}
    const sel=S.selOpt; // currently selected item index
    const allPlaced=chal.items.every(item=>placed.has(item.id));
    const allCorrect=chal.items.every(item=>placed.has(item.id)&&parseInt(placed.get?placed.get(item.id):S[`classify_${item.id}`])===item.correct);

    // items
    const itemBtns=chal.items.map(item=>{
      const isPlaced=placed.has(item.id);
      const placedIdx=isPlaced?S.classifyAnswers[item.id]:null;
      const isCorrect=isPlaced&&placedIdx===item.correct;
      const borderColor=isPlaced?(isCorrect?'#00ff41':'#ef4444'):(sel===item.id?'#f59e0b':'#1a2e1a');
      const bg=isPlaced?(isCorrect?'#0a1a0a':'#1a0a0a'):(sel===item.id?'#1a1a0a':'#0c160c');
      return`<div onclick="classifySelectItem('${item.id}')"
        style="border:1px solid ${borderColor};background:${bg};border-radius:3px;padding:10px 14px;margin-bottom:8px;cursor:pointer;font-size:12px;font-family:monospace;white-space:pre-wrap;line-height:1.6;transition:all 0.15s">
        ${isPlaced?`<span style="color:${isCorrect?'#00ff41':'#ef4444'}">${isCorrect?'✅':'❌'} </span>`:''}${item.label}
        ${isPlaced?`<div style="font-size:10px;color:#3d6b3a;margin-top:4px">${item.explain}</div>`:''}
      </div>`;
    }).join('');

    // buckets
    const bucketBtns=chal.buckets.map((b,i)=>`
      <div onclick="classifyPlaceItem(${i})"
        style="flex:1;border:1px solid ${sel!==null?'#f59e0b':'#1a2e1a'};background:${sel!==null?'#1a1a0a':'#0c160c'};border-radius:3px;padding:12px;text-align:center;cursor:${sel!==null?'pointer':'default'};font-size:12px;font-family:monospace;transition:all 0.15s">
        ${b}
      </div>`).join('');

    const submitBtn=allPlaced?`<button class="btn-primary" onclick="submitClassify()">CHECK ANSWERS</button>`:'';
    const selHint=sel!==null?`<div class="dim" style="margin:8px 0">✋ Now tap a bucket below to classify it:</div>`:`<div class="dim" style="margin:8px 0">👆 Tap an item above to select it, then tap a bucket below:</div>`;

    body=`<div class="h2">${chal.title}</div>
      <div class="dim" style="margin-bottom:10px">${chal.desc}</div>
      ${itemBtns}
      ${selHint}
      <div style="display:flex;gap:8px;margin-bottom:12px">${bucketBtns}</div>
      ${submitBtn}`;
  }


    const rows=chal.logs.map(log=>`<tr class="${S.selLog===log.id?'sel-log':''}" onclick="selectLog(${log.id})">
      <td>${log.id}</td><td>${log.time}</td><td>${log.src}</td><td>${log.dst}</td><td>${log.port}</td><td>${log.proto}</td></tr>`).join('');
    body=`<div class="h2">${chal.title}</div>
      <div class="dim">${chal.desc}</div>
      <div style="overflow-x:auto;margin-top:12px">
        <table><thead><tr><th>#</th><th>TIME</th><th>SOURCE IP</th><th>DESTINATION</th><th>PORT</th><th>PROTOCOL</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
      ${S.selLog!==null?`<button class="btn-primary" onclick="submitLog()">CONFIRM SELECTION</button>`:''}`;
  }

  const diagram = S.chalIdx === 0 && DIAGRAMS[chap.id] ? DIAGRAMS[chap.id] : '';
  const hintBox=S.hint?`<div class="hint-box"><div class="dim" style="margin-bottom:6px">▸ MAYA CHEN:</div>${S.hint}</div>`:'';
  return`<div class="main">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="dim">Ch.${chap.id} · Mission ${S.chalIdx+1}/${chap.challenges.length} · ${chal.xp} XP</div>
      <span class="tag" style="color:${DOMAINS[chap.domain].color}">${DOMAINS[chap.domain].label}</span>
    </div>
    ${diagram}
    <div class="card">${body}</div>
    <div>
      <button class="btn-orange" onclick="getHint()" ${S.hintLoading?'disabled':''}>${S.hintLoading?'⏳ LOADING...':'💡 ASK MAYA FOR HINT'}</button>
      <button class="btn-ghost" onclick="goTitle()">← MENU</button>
    </div>
    ${hintBox}
  </div>`;
}

      <div style="color:#00ff41;font-size:12px;margin-bottom:8px">▸ SHARE YOUR ACHIEVEMENT</div>
      <div style="color:#c8f7c5;font-size:13px;line-height:1.8">
        🎉 I just completed CyberGuard Chronicles — a CySA+ CS0-004 aligned cybersecurity training game!<br>
        🛡️ Rank: ${lvlTitle} · ${S.xp} XP · ${earned.length} badges · ${readiness}% CySA+ readiness<br>
        🎮 Try it: cyberguard-chronicless.vercel.app
      </div>
      <button class="btn-outline" style="margin-top:8px" onclick="copyShare()">📋 COPY SHARE TEXT</button>
    </div>
  </div>`;
}

function buildLeaderboard(){
  const earned=earnedBadges();
  const lb=S.leaderboard;
  const medals=['🥇','🥈','🥉'];

  const badgeGrid=BADGES.map(b=>{
    const has=earned.find(e=>e.id===b.id);
    return`<div style="background:${has?'#0a1a0a':'#080c08'};border:1px solid ${has?'#00ff41':'#1a2e1a'};border-radius:4px;padding:12px;text-align:center">
      <div style="font-size:28px;margin-bottom:6px;filter:${has?'none':'grayscale(1) opacity(0.3)'}">${b.icon}</div>
      <div style="color:${has?'#00ff41':'#3d6b3a'};font-size:11px;font-weight:bold;margin-bottom:3px">${b.label}</div>
      <div style="color:#3d6b3a;font-size:9px;line-height:1.4">${b.desc}</div>
      ${has?'<div style="color:#00ff41;font-size:9px;margin-top:4px">✅ EARNED</div>':'<div style="color:#3d6b3a;font-size:9px;margin-top:4px">🔒 LOCKED</div>'}
    </div>`;
  }).join('');

  const nameInput=!S.playerName?`
    <div class="card" style="border-color:#f59e0b;margin-bottom:14px">
      <div style="color:#f59e0b;font-size:12px;margin-bottom:8px">▸ ENTER YOUR AGENT NAME FOR THE LEADERBOARD</div>
      <div style="display:flex;gap:8px">
        <input id="agent-name" maxlength="20" placeholder="Agent name..." style="flex:1;background:#060a06;border:1px solid #1a2e1a;color:#c8f7c5;font-family:monospace;font-size:13px;padding:8px;border-radius:2px"/>
        <button class="btn-primary" style="margin:0" onclick="submitAgentName()">SAVE</button>
      </div>
    </div>`:`<div class="card" style="border-color:#00ff41;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">
      <div style="color:#00ff41;font-size:13px">👤 ${S.playerName}</div>
      <div style="color:#3d6b3a;font-size:11px">${S.xp} XP · ${earned.length} badges</div>
    </div>`;

  const lbRows=lb.length===0
    ?`<div class="card" style="color:#3d6b3a;text-align:center;padding:20px">No entries yet — be the first!</div>`
    :lb.map((p,i)=>`<div class="card" style="display:flex;align-items:center;gap:12px;margin-bottom:6px;${p.name===S.playerName?'border-color:#00ff41':''}">
        <div style="font-size:20px;min-width:28px">${medals[i]||`#${i+1}`}</div>
        <div style="flex:1">
          <div style="color:${p.name===S.playerName?'#00ff41':'#c8f7c5'};font-size:13px;font-weight:bold">${p.name} ${p.name===S.playerName?'← YOU':''}</div>
          <div class="dim">${PROFILES[p.profile]?.emoji||'💼'} ${PROFILES[p.profile]?.label||'Pro'} · ${p.badges} badges</div>
        </div>
        <div style="color:#00ff41;font-weight:bold;font-size:14px">${p.xp} XP</div>
      </div>`).join('');

  return`<div class="main">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="h2">🏆 LEADERBOARD & BADGES</div>
      <button class="btn-outline" onclick="toggleLeaderboard()">← BACK</button>
    </div>
    ${nameInput}
    <div class="h2">▸ YOUR BADGES (${earned.length}/${BADGES.length})</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:20px">
      ${badgeGrid}
    </div>
    <div class="h2">▸ TOP AGENTS</div>
    ${lbRows}
  </div>`;
}

function buildCodex(){
  const entries=S.codex.length===0
    ?`<div class="card" style="color:#3d6b3a;text-align:center;padding:40px">Complete missions to unlock entries.</div>`
    :S.codex.map(e=>`<div class="card" style="margin-bottom:8px"><div style="color:#00ff41;font-weight:bold;margin-bottom:5px">${e.term}</div><div style="font-size:13px;line-height:1.6">${e.def}</div></div>`).join('');
  return`<div class="main">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="h2">📚 SECURITY CODEX (${S.codex.length} entries)</div>
      <button class="btn-outline" onclick="toggleCodex()">← BACK</button>
    </div>${entries}</div>`;
}

// ─── FEEDBACK ─────────────────────────────────────────────────────────────────
function buildFeedback(){
  const fbs=S.feedbacks;
  const avg=fbs.length?(fbs.reduce((s,f)=>s+f.rating,0)/fbs.length).toFixed(1):null;
  const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
  const avgBlock=avg?`<div class="card" style="display:flex;gap:20px;align-items:center;margin-bottom:14px">
    <div style="text-align:center"><div style="font-size:36px;font-weight:bold;color:#00ff41">${avg}</div>
    <div style="color:#f59e0b;font-size:18px">${stars(Math.round(avg))}</div></div>
    <div class="dim">${fbs.length} review${fbs.length!==1?'s':''}</div></div>`:'';
  const formBlock=S.fbSubmitted
    ?`<div class="card" style="border-color:#00ff41;text-align:center;padding:18px;margin-bottom:16px"><div style="color:#00ff41">✅ Thanks for your feedback, Agent!</div></div>`
    :`<div class="card" style="border-color:#1a4a1a;margin-bottom:16px">
        <div style="color:#00ff41;font-size:12px;letter-spacing:1px;margin-bottom:12px">▸ LEAVE YOUR REVIEW</div>
        <div style="margin-bottom:10px">${[1,2,3,4,5].map(n=>`<span class="star" style="color:${n<=S.fbRating?'#f59e0b':'#1a2e1a'}" onclick="setRating(${n})">★</span>`).join('')}</div>
        <textarea class="fb" maxlength="200" oninput="setFbText(this.value)" placeholder="Share your experience...">${S.fbText}</textarea>
        <div class="dim" style="text-align:right;font-size:11px;margin-bottom:4px">${S.fbText.length}/200</div>
        <button class="btn-primary" onclick="submitFeedback()" ${(!S.fbRating||!S.fbText.trim()||S.fbLoading)?'disabled style="opacity:0.4;cursor:not-allowed"':''}>
          ${S.fbLoading?'SUBMITTING...':'SUBMIT FEEDBACK'}
        </button>
      </div>`;
  const reviewList=fbs.length===0
    ?`<div class="card" style="color:#3d6b3a;text-align:center;padding:30px">No reviews yet — be the first!</div>`
    :fbs.map(f=>`<div class="card" style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px">
          <span style="color:#f59e0b;font-size:14px">${stars(f.rating)}</span>
          <span class="dim">${f.xp} XP · ${new Date(f.created_at).toLocaleDateString()}</span>
        </div>
        <div style="font-size:13px;line-height:1.7">${f.text}</div>
      </div>`).join('');
  return`<div class="main">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="h2">💬 PLAYER FEEDBACK</div>
      <button class="btn-outline" onclick="toggleFeedback()">← BACK</button>
    </div>${avgBlock}${formBlock}
    <div class="h2">▸ RECENT REVIEWS</div>${reviewList}
  </div>`;
}

// ─── TYPEWRITER ───────────────────────────────────────────────────────────────
function startTyper(text){
  if(S.typerTimer)clearInterval(S.typerTimer);
  S.typerText='';S.typerIdx=0;S.typerDone=false;
  S.typerTimer=setInterval(()=>{
    const el=document.getElementById('typer-out');
    if(!el){clearInterval(S.typerTimer);return;}
    if(S.typerIdx>=text.length){
      clearInterval(S.typerTimer);S.typerDone=true;
      el.innerHTML=text.replace(/\n/g,'<br>');
      const btn=document.getElementById('typer-btn');
      if(btn)btn.style.display='block';
      return;
    }
    S.typerText=text.slice(0,++S.typerIdx);
    el.innerHTML=S.typerText.replace(/\n/g,'<br>')+'<span class="cursor">█</span>';
  },20);
}

function bindEvents(){
  if(S.screen==='story'&&!S.typerDone){
    const chap=GD.chapters[S.chapIdx];
    const p=S.profile||'pro';
    const storyArr=chap.story[p]||chap.story.pro;
    const scene=storyArr[S.sceneIdx];
    setTimeout(()=>startTyper(scene.text),300);
  }
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────────
window.selectProfile=p=>{S.profile=p;S.screen='title';render();};
window.goAgeSelect=()=>{S.screen='age_select';render();};
window.goTitle=()=>{S.screen='title';render();};
window.viewCertificate=()=>{
  S.showCertificate=true;
  S.showCodex=false;S.showFeedback=false;
  S.showDomains=false;S.showLeaderboard=false;
  render();
};
window.copyShare=()=>{
  const[,lvlTitle]=getLvl(S.xp);
  const readiness=cysa_readiness();
  const text=`🎉 I just completed CyberGuard Chronicles — a CySA+ CS0-004 aligned cybersecurity training game!\n🛡️ Rank: ${lvlTitle} · ${S.xp} XP · ${earnedBadges().length} badges · ${readiness}% CySA+ readiness\n🎮 Try it: cyberguard-chronicless.vercel.app`;
  navigator.clipboard.writeText(text).then(()=>{
    alert('✅ Share text copied to clipboard!');
  }).catch(()=>{alert('Could not copy — please copy manually.');});
};
window.downloadCert=()=>{
  const cert=document.getElementById('cert-card');
  if(!cert){log.warn('Certificate card not found');return;}
  // Print to PDF fallback — works on all devices including mobile
  const printWindow=window.open('','_blank');
  printWindow.document.write(`<html><head><title>CyberGuard Certificate</title>
    <style>body{margin:0;background:#080c08;display:flex;justify-content:center;padding:20px;font-family:monospace}
    @media print{body{padding:0}}</style></head>
    <body>${cert.outerHTML}<script>window.onload=()=>window.print()<\/script></body></html>`);
  printWindow.document.close();
};
window.toggleLeaderboard=async()=>{
  S.showLeaderboard=!S.showLeaderboard;
  S.showCodex=false;S.showFeedback=false;S.showDomains=false;
  if(S.showLeaderboard){S.leaderboard=await getLeaderboard();}
  render();
};
window.submitAgentName=async()=>{
  const el=document.getElementById('agent-name');
  if(!el||!el.value.trim())return;
  // A03 — sanitise name input
  S.playerName=el.value.trim().replace(/[<>]/g,'').slice(0,20);
  await saveLeaderboard();
  S.leaderboard=await getLeaderboard();
  render();
};
window.toggleCodex=()=>{S.showCodex=!S.showCodex;S.showFeedback=false;S.showDomains=false;S.showLeaderboard=false;render();};
window.toggleFeedback=()=>{S.showFeedback=!S.showFeedback;S.showCodex=false;S.showDomains=false;S.showLeaderboard=false;render();};
window.toggleDomains=()=>{S.showDomains=!S.showDomains;S.showCodex=false;S.showFeedback=false;S.showLeaderboard=false;render();};

window.startChap=async i=>{
  S.chapIdx=i;S.sceneIdx=0;S.chalIdx=0;
  S.result=null;S.hint=null;S.foundSpots=new Set();
  S.selLog=null;S.shift=0;S.selOpt=null;
  S.typerDone=false;S.screen='story';render();
  if(i===0)incrementCount().then(n=>{S.playerCount=n;});
};

window.advScene=()=>{
  const chap=GD.chapters[S.chapIdx];
  const p=S.profile||'pro';
  const storyArr=chap.story[p]||chap.story.pro;
  if(S.sceneIdx<storyArr.length-1){S.sceneIdx++;S.typerDone=false;render();}
  else{S.chalIdx=0;  S.result=null;S.hint=null;S.foundSpots=new Set();S.classifyAnswers={};S.selLog=null;S.shift=0;S.selOpt=null;S.screen='challenge';render();}
};

window.selectOpt=i=>{S.selOpt=i;render();};
window.addSpot=id=>{S.foundSpots.add(id);render();};
window.selectLog=id=>{S.selLog=id;render();};
window.setShift=v=>{S.shift=parseInt(v);render();};
window.setRating=n=>{S.fbRating=n;render();};
window.setFbText=v=>{S.fbText=v;};

function doSubmit(ok,expl,earned){
  if(ok)S.xp+=earned;
  S.result={ok,expl,earned:ok?earned:0};
  S.screen='result';render();
}

window.classifySelectItem=id=>{S.selOpt=id;render();};
window.classifyPlaceItem=bucketIdx=>{
  if(S.selOpt===null)return;
  S.classifyAnswers[S.selOpt]=bucketIdx;
  S.foundSpots.add(S.selOpt);
  S.selOpt=null;
  render();
};
window.submitClassify=()=>{
  const chal=GD.chapters[S.chapIdx].challenges[S.chalIdx];
  const allCorrect=chal.items.every(item=>S.classifyAnswers[item.id]===item.correct);
  const score=chal.items.filter(item=>S.classifyAnswers[item.id]===item.correct).length;
  const total=chal.items.length;
  const ok=score===total;
  if(ok)S.xp+=chal.xp;
  S.result={ok,expl:ok?`✅ Perfect! You correctly classified all ${total} items.`:`You got ${score}/${total} correct. Review the explanations on each item and try to remember the patterns.`,earned:ok?chal.xp:0};
  S.screen='result';render();
};
()=>{const chal=GD.chapters[S.chapIdx].challenges[S.chalIdx];doSubmit(S.selOpt===chal.correct,chal.explanations[S.selOpt],chal.xp);};
window.submitEmailSpot=()=>{const chal=GD.chapters[S.chapIdx].challenges[S.chalIdx];doSubmit(true,'Excellent! You identified all phishing indicators like a pro.',chal.xp);};
window.submitSpotFlags=()=>{const chal=GD.chapters[S.chapIdx].challenges[S.chalIdx];doSubmit(true,'Outstanding! You identified all vishing tactics used in the call.',chal.xp);};
window.submitCaesar=()=>{const chal=GD.chapters[S.chapIdx].challenges[S.chalIdx];doSubmit(true,`✅ Shift was ${chal.shift}. "${chal.answer}" — their plan is exposed! Caesar ciphers have only 25 possible shifts — trivially brute-forced. Modern encryption uses astronomically larger key spaces.`,chal.xp);};
window.submitLog=()=>{const chal=GD.chapters[S.chapIdx].challenges[S.chalIdx];const ok=S.selLog===chal.suspiciousId;doSubmit(ok,ok?chal.explanation:'❌ Not quite. Focus on external IPs (not 192.168.x.x) accessing internal services.',chal.xp);};

window.nextChal=()=>{
  const chap=GD.chapters[S.chapIdx];
  if(S.chalIdx<chap.challenges.length-1){
    S.chalIdx++;S.result=null;S.hint=null;S.foundSpots=new Set();S.selLog=null;S.shift=0;S.selOpt=null;S.screen='challenge';render();
  }else{
    const newE=chap.codex.filter(e=>!S.codex.find(c=>c.term===e.term));
    S.codex=[...S.codex,...newE];
    S.doneChaps=[...S.doneChaps,chap.id];
    S.screen='chap_end';render();
  }
};

window.getHint=async()=>{
  const chal=GD.chapters[S.chapIdx].challenges[S.chalIdx];
  S.hintLoading=true;render();
  try{
    const res=await fetch('/api/hint',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:chal.title})});
    const d=await res.json();
    S.hint=d.hint||'Think carefully about what looks unusual or out of place.';
  }catch{S.hint='Think carefully about what looks unusual or out of place.';}
  S.hintLoading=false;render();
};

window.submitFeedback=async()=>{
  if(!S.fbRating||!S.fbText.trim()||S.fbLoading)return;
  S.fbLoading=true;render();
  const ok=await saveFeedback(S.fbRating,S.fbText.trim(),S.xp);
  if(ok){S.fbSubmitted=true;S.feedbacks=await getFeedbacks();}
  S.fbLoading=false;render();
};

// ─── INIT ─────────────────────────────────────────────────────────────────────
(async()=>{
  render();
  getCount().then(c=>{S.playerCount=c;if(S.screen==='title')render();});
  getFeedbacks().then(f=>{S.feedbacks=f;if(S.screen==='title')render();});
})();
</script>
