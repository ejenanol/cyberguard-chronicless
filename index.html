async function getCount(){try{var r=await sb.from('player_count').select('count').eq('id',1).single();return r.data?r.data.count:0;}catch(e){return 0;}}
async function incCount(){try{var c=await getCount();await sb.from('player_count').update({count:c+1}).eq('id',1);return c+1;}catch(e){return 0;}}
async function getFeedbacks(){try{var r=await sb.from('feedback').select('*').order('created_at',{ascending:false}).limit(50);return r.data||[];}catch(e){return[];}}
async function saveFeedback(rating,text,xp){try{var clean=String(text).slice(0,200).replace(/[<>]/g,'');await sb.from('feedback').insert({rating:parseInt(rating),text:clean,xp:parseInt(xp)||0});return true;}catch(e){return false;}}
async function getLeaderboard(){try{var r=await sb.from('leaderboard').select('*').order('xp',{ascending:false}).limit(10);return r.data||[];}catch(e){return[];}}
async function saveLeaderboard(){try{if(!ST.playerName)return;await sb.from('leaderboard').upsert({name:ST.playerName,xp:ST.xp,profile:ST.profile||'pro',badges:earnedBadges().length,updated_at:new Date().toISOString()},{onConflict:'name'});}catch(e){console.error('leaderboard save failed',e);}}

var ST={
  screen:'age_select',profile:null,
  chapIdx:0,sceneIdx:0,chalIdx:0,
  xp:0,codex:[],doneChaps:[],
  result:null,hint:null,hintLoading:false,
  typerDone:false,
  foundSpots:new Set(),classifyAnswers:{},selectedItem:null,
  selLog:null,shift:0,selOpt:null,
  showCodex:false,showFeedback:false,showDomains:false,
  showLeaderboard:false,showCertificate:false,
  playerCount:null,feedbacks:[],leaderboard:[],
  fbRating:0,fbText:'',fbSubmitted:false,fbLoading:false,
  playerName:null,
  typerText:'',typerIdx:0,typerTimer:null
};

var MAX_XP=GD.reduce(function(a,c){return a+c.challenges.reduce(function(b,ch){return b+ch.xp;},0);},0);

function getLvl(xp){
  if(xp<200)return[1,'Script Kiddie'];
  if(xp<500)return[2,'Junior Analyst'];
  if(xp<900)return[3,'SOC Analyst'];
  if(xp<1400)return[4,'Security Specialist'];
  if(xp<2000)return[5,'Senior Analyst'];
  return[6,'CyberGuard Elite'];
}

function decipher(txt,n){
  return txt.split('').map(function(c){
    var code=c.charCodeAt(0);
    if(code>=65&&code<=90)return String.fromCharCode(((code-65-n+26)%26)+65);
    return c;
  }).join('');
}

function pc(){return ST.profile&&PROFILES[ST.profile]?PROFILES[ST.profile].color:'#00ff41';}

function domainProgress(){
  var prog={};
  Object.keys(DOMAINS).forEach(function(d){
    var total=GD.filter(function(c){return c.domain===d;}).length;
    var done=GD.filter(function(c){return c.domain===d&&ST.doneChaps.includes(c.id);}).length;
    prog[d]={total:total,done:done,pct:total?Math.round(done/total*100):0};
  });
  return prog;
}

function cysa(){
  var prog=domainProgress();
  return Math.round(Object.keys(DOMAINS).reduce(function(a,d){return a+prog[d].pct*(DOMAINS[d].weight/100);},0));
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  try{
    document.getElementById('app').innerHTML=buildApp();
    bindEvents();
  }catch(err){
    document.getElementById('app').innerHTML='<div style="color:#ef4444;font-family:monospace;padding:40px;text-align:center"><div style="font-size:32px;margin-bottom:16px">⚠️</div><div style="margin-bottom:16px">'+err.message+'</div><button onclick="location.reload()" style="background:#00ff41;border:none;color:#080c08;padding:8px 20px;cursor:pointer;font-family:monospace">↺ RELOAD</button></div>';
  }
}

function buildApp(){
  if(ST.showCertificate)return hdr()+buildCert();
  if(ST.showLeaderboard)return hdr()+buildLB();
  if(ST.showFeedback)return hdr()+buildFB();
  if(ST.showCodex)return hdr()+buildCodex();
  if(ST.showDomains)return hdr()+buildDomains();
  if(ST.screen==='age_select')return buildAge();
  if(ST.screen==='title')return hdr()+buildTitle();
  if(ST.screen==='story')return hdr()+buildStory();
  if(ST.screen==='challenge')return hdr()+buildChallenge();
  if(ST.screen==='result')return hdr()+buildResult();
  if(ST.screen==='chap_end')return hdr()+buildChapEnd();
  return hdr()+'<div class="main"><div class="dim">Loading...</div></div>';
}

// ─── HEADER ───────────────────────────────────────────────────────────────────
function hdr(){
  var lvl=getLvl(ST.xp);
  var pct=Math.min(ST.xp/MAX_XP*100,100);
  var p=PROFILES[ST.profile||'pro'];
  return '<div class="hdr">'+
    '<div style="color:'+pc()+';font-size:13px;font-weight:bold;letter-spacing:2px">⚡ CYBERGUARD</div>'+
    '<div style="display:flex;align-items:center;gap:6px">'+
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">'+
        '<div class="dim">LVL '+lvl[0]+' · '+lvl[1]+'</div>'+
        '<div style="display:flex;align-items:center;gap:6px">'+
          '<div style="width:80px;height:5px;background:#1a2e1a;border-radius:3px"><div style="width:'+pct+'%;height:100%;background:'+pc()+';border-radius:3px"></div></div>'+
          '<span style="font-size:11px;color:'+pc()+'">'+ST.xp+' XP</span>'+
        '</div>'+
      '</div>'+

// ─── CHALLENGE ────────────────────────────────────────────────────────────────
function buildChallenge(){
  var chap=GD[ST.chapIdx];
  var chal=chap.challenges[ST.chalIdx];
  var body='';

  if(chal.type==='mcq'){
    var opts=chal.options.map(function(opt,i){
      var cls='opt'+(ST.selOpt===i?(i===chal.correct?' ok':' bad'):'');
      return '<div class="'+cls+'" onclick="ST.selOpt='+i+';render()">['+String.fromCharCode(65+i)+'] '+opt+'</div>';
    }).join('');
    body='<div class="h2">'+chal.title+'</div>'+
      '<div class="card" style="background:#080c08;white-space:pre-wrap;font-size:13px;line-height:1.9">'+chal.question+'</div>'+
      opts+
      (ST.selOpt!==null?'<button class="btn-p" onclick="submitMCQ()">SUBMIT ANSWER</button>':'');
  }

  if(chal.type==='email_spot'){
    var found=ST.foundSpots;
    function sp(id,label,col){
      var active=found.has(id);
      var color=active?'#00ff41':(col||'#f97316');
      var border=active?'1px solid #00ff41':'1px dashed #f97316';
      return '<span style="cursor:pointer;border-bottom:'+border+';color:'+color+'" onclick="addSpot(\''+id+'\')">'+label+'</span>';
    }
    var foundList=[...found].map(function(id){var s=chal.spots.find(function(x){return x.id===id;});return s?'<div style="color:#00ff41;font-size:12px;margin-top:5px">✓ '+s.label+'</div>':'';}).join('');
    body='<div class="h2">'+chal.title+'</div>'+
      '<div class="dim">'+chal.desc+'</div>'+
      '<div class="card" style="background:#060a06;margin-top:12px;font-size:13px">'+
        '<div class="dim" style="margin-bottom:10px;line-height:1.8">FROM: '+sp('em','security@nexac0rp.com')+'<br>TO: you@nexacorp.com<br>SUBJECT: '+sp('ur','⚠️ URGENT: Your account suspended in 24 hours!')+'</div>'+
        '<div style="border-top:1px solid #1a2e1a;padding-top:12px;line-height:2">Dear Valued Employee,<br><br>We detected unusual activity. Your account will be '+sp('ur','SUSPENDED unless you verify IMMEDIATELY')+'.<br><br>Click here → '+sp('lk','http://nexacorp-security.verify-now.tk/login','#06b6d4')+'<br><br>'+sp('th','Failure to act within 24 hours = permanent account termination.')+'<br><br>— NexaCorp Security Team</div>'+
      '</div>'+
      '<div style="margin-top:10px"><div class="dim">Found: '+found.size+' / '+chal.spots.length+'</div>'+foundList+'</div>'+
      (found.size===chal.spots.length?'<button class="btn-p" onclick="submitEmailSpot()">CONFIRM — ALL FOUND ✓</button>':'');
  }

  if(chal.type==='spot_flags'){
    var found2=ST.foundSpots;
    function spf(id,text){
      var active=found2.has(id);
      return '<span style="cursor:pointer;background:'+(active?'#1a3a1a':'transparent')+';border-bottom:'+(active?'1px solid #00ff41':'1px dashed #f97316')+';color:'+(active?'#00ff41':'#f97316')+';padding:1px 2px" onclick="addSpot(\''+id+'\')">'+text+'</span>';
    }
    var foundList2=[...found2].map(function(id){var s=chal.spots.find(function(x){return x.id===id;});return s?'<div style="color:#00ff41;font-size:12px;margin-top:5px">✓ '+s.label+'</div>':'';}).join('');
    body='<div class="h2">'+chal.title+'</div>'+
      '<div class="dim">'+chal.desc+'</div>'+
      '<div class="card" style="background:#060a06;margin-top:12px;font-size:13px;line-height:2.2">'+
        '"Good afternoon, I am calling from Microsoft Security. '+spf('fa','[1] We detected your computer is sending viruses')+' and '+spf('ur','[2] if we do not fix it in 15 minutes your account will be permanently deleted.')+' I need you to '+spf('ra','[3] download a remote access tool')+' so I can fix it, and '+spf('py','[4] provide your credit card for the $49.99 security fee')+'."'+
      '</div>'+
      '<div style="margin-top:10px"><div class="dim">Found: '+found2.size+' / '+chal.spots.length+'</div>'+foundList2+'</div>'+
      (found2.size===chal.spots.length?'<button class="btn-p" onclick="submitSpotFlags()">CONFIRM — ALL FOUND ✓</button>':'');
  }

  if(chal.type==='classify'){
    var ans=ST.classifyAnswers;
    var selItem=ST.selectedItem;
    var allPlaced=chal.items.every(function(item){return ans.hasOwnProperty(item.id);});
    var itemBtns=chal.items.map(function(item){
      var isPlaced=ans.hasOwnProperty(item.id);
      var isCorrect=isPlaced&&ans[item.id]===item.correct;
      var borderColor=isPlaced?(isCorrect?'#00ff41':'#ef4444'):(selItem===item.id?'#f59e0b':'#1a2e1a');
      var bg=isPlaced?(isCorrect?'#0a1a0a':'#1a0a0a'):(selItem===item.id?'#1a1a0a':'#0c160c');
      return '<div onclick="ST.selectedItem=\''+(isPlaced?null:item.id)+'\';render()" style="border:1px solid '+borderColor+';background:'+bg+';border-radius:3px;padding:10px 14px;margin-bottom:8px;cursor:pointer;font-size:12px;white-space:pre-wrap;line-height:1.6">'+
        (isPlaced?'<span style="color:'+(isCorrect?'#00ff41':'#ef4444')+'">'+(isCorrect?'✅':'❌')+' </span>':'')+item.label+
        (isPlaced?'<div style="font-size:10px;color:#3d6b3a;margin-top:4px">'+item.explain+'</div>':'')+
      '</div>';
    }).join('');
    var buckets=chal.buckets.map(function(b,i){
      return '<div onclick="placeItem('+i+')" style="flex:1;border:1px solid '+(selItem?'#f59e0b':'#1a2e1a')+';background:'+(selItem?'#1a1a0a':'#0c160c')+';border-radius:3px;padding:12px;text-align:center;cursor:'+(selItem?'pointer':'default')+';font-size:12px;transition:all 0.15s">'+b+'</div>';
    }).join('');
    body='<div class="h2">'+chal.title+'</div>'+
      '<div class="dim" style="margin-bottom:10px">'+chal.desc+'</div>'+
      itemBtns+
      '<div class="dim" style="margin:8px 0">'+(selItem?'✋ Now tap a bucket below:':'👆 Tap an item above to select it, then tap a bucket below:')+'</div>'+
      '<div style="display:flex;gap:8px;margin-bottom:12px">'+buckets+'</div>'+
      (allPlaced?'<button class="btn-p" onclick="submitClassify()">CHECK ANSWERS</button>':'');
  }

  if(chal.type==='caesar'){
    var decoded=ST.shift>0?decipher(chal.encrypted,ST.shift):'——————————————————';
    var correct=decoded===chal.answer;
    body='<div class="h2">'+chal.title+'</div>'+
      '<div class="card" style="background:#060a06">'+
        '<div class="dim">ENCRYPTED:</div>'+
        '<div style="color:#f97316;font-size:18px;letter-spacing:4px;margin:10px 0;font-weight:bold">'+chal.encrypted+'</div>'+
        '<div class="dim">YOUR DECRYPTION (shift = '+ST.shift+'):</div>'+
        '<div style="color:'+(correct?'#00ff41':'#c8f7c5')+';font-size:18px;letter-spacing:4px;margin:10px 0;min-height:28px">'+decoded+'</div>'+
      '</div>'+
      '<div style="display:flex;align-items:center;gap:14px;margin:14px 0;padding:14px;background:#0c160c;border-radius:3px">'+
        '<span class="dim">SHIFT:</span>'+
        '<input type="range" min="0" max="25" value="'+ST.shift+'" oninput="ST.shift=parseInt(this.value);render()" style="flex:1;accent-color:'+pc()+';cursor:pointer">'+
        '<span style="color:'+pc()+';min-width:24px;font-size:18px;font-weight:bold">'+ST.shift+'</span>'+
      '</div>'+
      (correct?'<button class="btn-p" onclick="submitCaesar()">CONFIRM DECRYPTION ▶</button>':'')+
      (!correct&&ST.shift>0?'<div class="dim" style="margin-top:6px">Keep adjusting... make it readable English.</div>':'');
  }

  if(chal.type==='log_analysis'){
    var rows=chal.logs.map(function(log){
      return '<tr class="'+(ST.selLog===log.id?'sel':'')+'" onclick="ST.selLog='+log.id+';render()">'+
        '<td>'+log.id+'</td><td>'+log.time+'</td><td>'+log.src+'</td><td>'+log.dst+'</td><td>'+log.port+'</td><td>'+log.proto+'</td>'+
      '</tr>';
    }).join('');
    body='<div class="h2">'+chal.title+'</div>'+
      '<div class="dim">'+chal.desc+'</div>'+
      '<div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th>#</th><th>TIME</th><th>SOURCE IP</th><th>DEST</th><th>PORT</th><th>PROTO</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      (ST.selLog!==null?'<button class="btn-p" onclick="submitLog()">CONFIRM SELECTION</button>':'');
  }

  var hintBox=ST.hint?'<div style="border:1px solid #f97316;border-radius:3px;padding:18px;margin-top:12px;color:#f97316;font-size:13px;line-height:1.8"><div class="dim" style="margin-bottom:6px">▸ MAYA CHEN:</div>'+ST.hint+'</div>':'';
  var dom=DOMAINS[chap.domain];

  return '<div class="main">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'+
      '<div class="dim">Ch.'+chap.id+' · Mission '+(ST.chalIdx+1)+'/'+chap.challenges.length+' · '+chal.xp+' XP</div>'+
      '<span style="background:#1a2e1a;padding:2px 8px;border-radius:2px;font-size:11px;color:'+dom.color+'">'+dom.label+'</span>'+
    '</div>'+
    '<div class="card">'+body+'</div>'+
    '<div>'+
      '<button class="btn-or" onclick="getHint()" '+(ST.hintLoading?'disabled':'')+'>'+( ST.hintLoading?'⏳ LOADING...':'💡 ASK MAYA FOR HINT')+'</button>'+
      '<button class="btn-g" onclick="ST.screen=\'title\';render()">← MENU</button>'+
    '</div>'+
    hintBox+
  '</div>';
}

// ─── FEEDBACK ────────────────────────────────────────────────────────────────
function buildFB(){
  var fbs=ST.feedbacks;
  var avg=fbs.length?(fbs.reduce(function(s,f){return s+f.rating;},0)/fbs.length).toFixed(1):null;
  function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n);}
  var avgBlock=avg?'<div class="card" style="display:flex;gap:20px;align-items:center;margin-bottom:14px"><div style="text-align:center"><div style="font-size:36px;font-weight:bold;color:#00ff41">'+avg+'</div><div style="color:#f59e0b;font-size:18px">'+stars(Math.round(avg))+'</div></div><div class="dim">'+fbs.length+' review'+(fbs.length!==1?'s':'')+'</div></div>':'';
  var starBtns=[1,2,3,4,5].map(function(n){return '<span style="font-size:26px;cursor:pointer;color:'+(n<=ST.fbRating?'#f59e0b':'#1a2e1a')+';margin-right:4px" onclick="ST.fbRating='+n+';render()">★</span>';}).join('');
  var formBlock=ST.fbSubmitted?
    '<div class="card" style="border-color:#00ff41;text-align:center;padding:18px;margin-bottom:16px"><div style="color:#00ff41">✅ Thanks for your feedback, Agent!</div></div>':
    '<div class="card" style="border-color:#1a4a1a;margin-bottom:16px">'+
      '<div style="color:#00ff41;font-size:12px;letter-spacing:1px;margin-bottom:12px">▸ LEAVE YOUR REVIEW</div>'+
      '<div style="margin-bottom:10px">'+starBtns+'</div>'+
      '<textarea style="width:100%;background:#060a06;border:1px solid #1a2e1a;color:#c8f7c5;font-size:13px;padding:10px;border-radius:2px;resize:vertical;min-height:70px" maxlength="200" oninput="ST.fbText=this.value" placeholder="Share your experience...">'+ST.fbText+'</textarea>'+
      '<div class="dim" style="text-align:right;font-size:11px;margin-bottom:4px">'+ST.fbText.length+'/200</div>'+
      '<button class="btn-p" onclick="submitFB()" '+((!ST.fbRating||!ST.fbText.trim()||ST.fbLoading)?'disabled style="opacity:0.4;cursor:not-allowed"':'')+'>'+( ST.fbLoading?'SUBMITTING...':'SUBMIT FEEDBACK')+'</button>'+
    '</div>';
  var reviews=fbs.length===0?'<div class="card" style="color:#3d6b3a;text-align:center;padding:30px">No reviews yet — be the first!</div>':
    fbs.map(function(f){return '<div class="card" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:#f59e0b;font-size:14px">'+stars(f.rating)+'</span><span class="dim">'+f.xp+' XP · '+new Date(f.created_at).toLocaleDateString()+'</span></div><div style="font-size:13px;line-height:1.7">'+f.text+'</div></div>';}).join('');
  return '<div class="main">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'+
      '<div class="h2">💬 PLAYER FEEDBACK</div><button class="btn-o" onclick="tog(\'showFeedback\')">← BACK</button>'+
    '</div>'+avgBlock+formBlock+'<div class="h2">▸ RECENT REVIEWS</div>'+reviews+'</div>';
}

// ─── LEADERBOARD ──────────────────────────────────────────────────────────────
function buildLB(){
  var earned=earnedBadges();
  var lb=ST.leaderboard;
  var medals=['🥇','🥈','🥉'];
  var badgeGrid=BADGES.map(function(b){
    var has=earned.find(function(e){return e.id===b.id;});
    return '<div style="background:'+(has?'#0a1a0a':'#080c08')+';border:1px solid '+(has?'#00ff41':'#1a2e1a')+';border-radius:4px;padding:12px;text-align:center">'+
      '<div style="font-size:28px;margin-bottom:6px;filter:'+(has?'none':'grayscale(1) opacity(0.3)')+'">'+b.icon+'</div>'+
      '<div style="color:'+(has?'#00ff41':'#3d6b3a')+';font-size:11px;font-weight:bold;margin-bottom:3px">'+b.label+'</div>'+
      '<div style="color:#3d6b3a;font-size:9px;line-height:1.4">'+b.desc+'</div>'+
      (has?'<div style="color:#00ff41;font-size:9px;margin-top:4px">✅ EARNED</div>':'<div style="color:#3d6b3a;font-size:9px;margin-top:4px">🔒 LOCKED</div>')+
    '</div>';
  }).join('');
  var nameInput=!ST.playerName?
    '<div class="card" style="border-color:#f59e0b;margin-bottom:14px">'+
      '<div style="color:#f59e0b;font-size:12px;margin-bottom:8px">▸ ENTER YOUR AGENT NAME FOR THE LEADERBOARD</div>'+
      '<div style="display:flex;gap:8px"><input id="aname" maxlength="20" placeholder="Agent name..." style="flex:1;background:#060a06;border:1px solid #1a2e1a;color:#c8f7c5;font-size:13px;padding:8px;border-radius:2px"><button class="btn-p" style="margin:0" onclick="saveAgentName()">SAVE</button></div>'+
    '</div>':
    '<div class="card" style="border-color:#00ff41;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center"><div style="color:#00ff41;font-size:13px">👤 '+ST.playerName+'</div><div style="color:#3d6b3a;font-size:11px">'+ST.xp+' XP · '+earned.length+' badges</div></div>';
  var lbRows=lb.length===0?
    '<div class="card" style="color:#3d6b3a;text-align:center;padding:20px">No entries yet — be the first!</div>':
    lb.map(function(p,i){return '<div class="card" style="display:flex;align-items:center;gap:12px;margin-bottom:6px;'+(p.name===ST.playerName?'border-color:#00ff41':'')+'">'+(medals[i]||'#'+(i+1))+'<div style="flex:1"><div style="color:'+(p.name===ST.playerName?'#00ff41':'#c8f7c5')+';font-size:13px;font-weight:bold">'+p.name+(p.name===ST.playerName?' ← YOU':'')+'</div><div class="dim">'+p.badges+' badges</div></div><div style="color:#00ff41;font-weight:bold;font-size:14px">'+p.xp+' XP</div></div>';}).join('');
  return '<div class="main">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'+
      '<div class="h2">🏆 LEADERBOARD & BADGES</div><button class="btn-o" onclick="tog(\'showLeaderboard\')">← BACK</button>'+
    '</div>'+nameInput+
    '<div class="h2">▸ YOUR BADGES ('+earned.length+'/'+BADGES.length+')</div>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:20px">'+badgeGrid+'</div>'+
    '<div class="h2">▸ TOP AGENTS</div>'+lbRows+
  '</div>';
}

// ─── CERTIFICATE ──────────────────────────────────────────────────────────────
function buildCert(){
  var earned=earnedBadges();
  var lvl=getLvl(ST.xp);
  var p=PROFILES[ST.profile||'pro'];
  var date=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  var name=ST.playerName||'Cyber Agent';
  var r=cysa();
  return '<div class="main">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'+
      '<div class="h2">📜 YOUR CERTIFICATE</div>'+
      '<div style="display:flex;gap:8px"><button class="btn-p" onclick="window.print()">⬇️ PRINT / SAVE</button><button class="btn-o" onclick="ST.showCertificate=false;render()">← BACK</button></div>'+
    '</div>'+
    '<div id="cert" style="background:#080c08;border:2px solid #00ff41;border-radius:8px;padding:32px;text-align:center;position:relative;overflow:hidden">'+
      '<div style="position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#00ff41,#06b6d4,#a855f7,#f97316,#00ff41)"></div>'+
      '<div style="position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#f97316,#a855f7,#06b6d4,#00ff41)"></div>'+
      '<div style="font-size:48px;margin-bottom:8px">🛡️</div>'+
      '<div style="color:#3d6b3a;font-size:11px;letter-spacing:3px;margin-bottom:4px">CERTIFICATE OF COMPLETION</div>'+
      '<h1 style="color:#00ff41;font-size:22px;letter-spacing:4px;margin-bottom:4px">CYBERGUARD CHRONICLES</h1>'+
      '<div style="color:#3d6b3a;font-size:11px;margin-bottom:24px">CySA+ CS0-004 Aligned · CIS Benchmark Edition</div>'+
      '<div style="color:#3d6b3a;font-size:12px;margin-bottom:8px">This certifies that</div>'+
      '<div style="color:#f59e0b;font-size:28px;font-weight:bold;margin-bottom:8px;letter-spacing:2px">'+name+'</div>'+
      '<div style="color:#c8f7c5;font-size:13px;margin-bottom:20px;line-height:1.8">has successfully completed <strong style="color:#00ff41">'+ST.doneChaps.length+' of 19 chapters</strong><br>achieving the rank of <strong style="color:#00ff41">'+lvl[1]+'</strong><br>with a CySA+ CS0-004 readiness score of <strong style="color:'+(r>75?'#00ff41':r>40?'#f59e0b':'#ef4444')+'">'+r+'%</strong></div>'+
      '<div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:20px">'+
        earned.map(function(b){return '<span style="background:#0c160c;border:1px solid #1a2e1a;border-radius:20px;padding:4px 12px;font-size:12px">'+b.icon+' '+b.label+'</span>';}).join('')+
      '</div>'+
      '<div style="display:flex;justify-content:center;gap:24px;margin-bottom:20px">'+
        '<div style="text-align:center"><div style="color:#00ff41;font-size:24px;font-weight:bold">'+ST.xp+'</div><div style="color:#3d6b3a;font-size:10px">XP EARNED</div></div>'+
        '<div style="text-align:center"><div style="color:#00ff41;font-size:24px;font-weight:bold">'+earned.length+'</div><div style="color:#3d6b3a;font-size:10px">BADGES</div></div>'+
        '<div style="text-align:center"><div style="color:#00ff41;font-size:24px;font-weight:bold">'+ST.doneChaps.length+'</div><div style="color:#3d6b3a;font-size:10px">CHAPTERS</div></div>'+
        '<div style="text-align:center"><div style="color:#00ff41;font-size:24px;font-weight:bold">'+p.emoji+'</div><div style="color:#3d6b3a;font-size:10px">'+p.label.toUpperCase()+'</div></div>'+
      '</div>'+
      '<div style="border-top:1px solid #1a2e1a;padding-top:16px">'+
        '<div style="color:#3d6b3a;font-size:10px">Issued: '+date+'</div>'+
        '<div style="color:#3d6b3a;font-size:10px;margin-top:4px">cyberguard-chronicless.vercel.app · Powered by Claude AI & Anthropic</div>'+
      '</div>'+
    '</div>'+
    '<div class="card" style="margin-top:12px">'+
      '<div style="color:#00ff41;font-size:12px;margin-bottom:8px">▸ SHARE YOUR ACHIEVEMENT</div>'+
      '<div style="color:#c8f7c5;font-size:13px;line-height:1.8">🎉 I completed CyberGuard Chronicles — CySA+ CS0-004 aligned cybersecurity training!<br>🛡️ Rank: '+lvl[1]+' · '+ST.xp+' XP · '+earned.length+' badges · '+r+'% CySA+ readiness<br>🎮 Try it: cyberguard-chronicless.vercel.app</div>'+
      '<button class="btn-o" style="margin-top:8px" onclick="copyShare()">📋 COPY SHARE TEXT</button>'+
    '</div>'+
  '</div>';
}

// ─── TYPEWRITER ───────────────────────────────────────────────────────────────
function startTyper(text){
  if(ST.typerTimer)clearInterval(ST.typerTimer);
  var idx=0;ST.typerDone=false;
  ST.typerTimer=setInterval(function(){
    var el=document.getElementById('typer-out');
    if(!el){clearInterval(ST.typerTimer);return;}
    if(idx>=text.length){
      clearInterval(ST.typerTimer);ST.typerDone=true;
      el.innerHTML=text.replace(/\n/g,'<br>');
      var btn=document.getElementById('typer-btn');
      if(btn)btn.style.display='block';
      return;
    }
    el.innerHTML=text.slice(0,++idx).replace(/\n/g,'<br>')+'<span class="cur">█</span>';
  },20);
}

function bindEvents(){
  if(ST.screen==='story'&&!ST.typerDone){
    var chap=GD[ST.chapIdx];
    var p=ST.profile||'pro';
    var txt=chap.story[p]||chap.story.pro;
    setTimeout(function(){startTyper(txt);},300);
  }
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────────
function resetChal(){
  ST.result=null;ST.hint=null;
  ST.foundSpots=new Set();ST.classifyAnswers={};ST.selectedItem=null;
  ST.selLog=null;ST.shift=0;ST.selOpt=null;
}

function tog(key){
  var keys=['showCodex','showFeedback','showDomains','showLeaderboard','showCertificate'];
  keys.forEach(function(k){ST[k]=k===key?!ST[k]:false;});
  if(key==='showLeaderboard'&&ST.showLeaderboard){
    getLeaderboard().then(function(lb){ST.leaderboard=lb;render();});
  } else {render();}
}

window.selProfile=function(p){ST.profile=p;ST.screen='title';render();};

window.startChap=async function(i){
  ST.chapIdx=i;ST.sceneIdx=0;ST.chalIdx=0;
  resetChal();ST.typerDone=false;ST.screen='story';render();
  if(i===0){incCount().then(function(n){ST.playerCount=n;});}
};

window.advScene=function(){
  resetChal();ST.chalIdx=0;ST.screen='challenge';render();
};

window.addSpot=function(id){ST.foundSpots.add(id);render();};
window.placeItem=function(bucketIdx){
  if(!ST.selectedItem)return;
  ST.classifyAnswers[ST.selectedItem]=bucketIdx;
  ST.selectedItem=null;render();
};

function doSubmit(ok,expl,earned){
  if(ok)ST.xp+=earned;
  ST.result={ok:ok,expl:expl,earned:ok?earned:0};
  ST.screen='result';render();
}

window.submitMCQ=function(){
  var chal=GD[ST.chapIdx].challenges[ST.chalIdx];
  doSubmit(ST.selOpt===chal.correct,chal.explanations[ST.selOpt],chal.xp);
};
window.submitEmailSpot=function(){
  doSubmit(true,'Excellent! You identified all phishing indicators like a pro.',GD[ST.chapIdx].challenges[ST.chalIdx].xp);
};
window.submitSpotFlags=function(){
  doSubmit(true,'Outstanding! You identified all vishing tactics used in the call.',GD[ST.chapIdx].challenges[ST.chalIdx].xp);
};
window.submitCaesar=function(){
  var chal=GD[ST.chapIdx].challenges[ST.chalIdx];
  doSubmit(true,'✅ Shift was '+chal.shift+'. "'+chal.answer+'" — their plan is exposed! Caesar ciphers have only 25 possible shifts — trivially brute-forced.',chal.xp);
};
window.submitLog=function(){
  var chal=GD[ST.chapIdx].challenges[ST.chalIdx];
  var ok=ST.selLog===chal.suspId;
  doSubmit(ok,ok?chal.explanation:'❌ Not quite. Focus on external IPs (not 192.168.x.x) accessing internal services.',chal.xp);
};
window.submitClassify=function(){
  var chal=GD[ST.chapIdx].challenges[ST.chalIdx];
  var score=chal.items.filter(function(item){return ST.classifyAnswers[item.id]===item.correct;}).length;
  var ok=score===chal.items.length;
  if(ok)ST.xp+=chal.xp;
  ST.result={ok:ok,expl:ok?'✅ Perfect! You correctly classified all '+chal.items.length+' items.':'You got '+score+'/'+chal.items.length+' correct. Review the explanations on each item.',earned:ok?chal.xp:0};
  ST.screen='result';render();
};

window.nextChal=async function(){
  var chap=GD[ST.chapIdx];
  if(ST.chalIdx<chap.challenges.length-1){
    ST.chalIdx++;resetChal();ST.screen='challenge';render();
  } else {
    var newE=chap.codex.filter(function(e){return !ST.codex.find(function(c){return c.term===e.term;});});
    ST.codex=ST.codex.concat(newE);
    ST.doneChaps=ST.doneChaps.concat([chap.id]);
    if(ST.playerName)await saveLeaderboard();
    ST.screen='chap_end';render();
  }
};

window.getHint=async function(){
  var chal=GD[ST.chapIdx].challenges[ST.chalIdx];
  ST.hintLoading=true;render();
  try{
    var res=await fetch('/api/hint',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:chal.title})});
    var d=await res.json();
    ST.hint=d.hint||'Think carefully about what looks unusual or out of place.';
  }catch(e){ST.hint='Think carefully about what looks unusual or out of place.';}
  ST.hintLoading=false;render();
};

window.submitFB=async function(){
  if(!ST.fbRating||!ST.fbText.trim()||ST.fbLoading)return;
  ST.fbLoading=true;render();
  var ok=await saveFeedback(ST.fbRating,ST.fbText.trim(),ST.xp);
  if(ok){ST.fbSubmitted=true;ST.feedbacks=await getFeedbacks();}
  ST.fbLoading=false;render();
};

window.saveAgentName=async function(){
  var el=document.getElementById('aname');
  if(!el||!el.value.trim())return;
  ST.playerName=el.value.trim().replace(/[<>]/g,'').slice(0,20);
  await saveLeaderboard();
  ST.leaderboard=await getLeaderboard();
  render();
};

window.copyShare=function(){
  var lvl=getLvl(ST.xp);
  var r=cysa();
  var text='🎉 I completed CyberGuard Chronicles — CySA+ CS0-004 aligned cybersecurity training!\n🛡️ Rank: '+lvl[1]+' · '+ST.xp+' XP · '+earnedBadges().length+' badges · '+r+'% CySA+ readiness\n🎮 Try it: cyberguard-chronicless.vercel.app';
  navigator.clipboard.writeText(text).then(function(){alert('✅ Copied!');}).catch(function(){alert('Please copy manually.');});
};

// ─── INIT ─────────────────────────────────────────────────────────────────────
(async function(){
  render();
  getCount().then(function(c){ST.playerCount=c;if(ST.screen==='title')render();});
  getFeedbacks().then(function(f){ST.feedbacks=f;if(ST.screen==='title')render();});
})();
</script>
