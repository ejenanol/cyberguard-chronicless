name: Verify game and SOC simulation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Select the runner's installed browser
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "CHROMIUM_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
            /usr/bin/google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
